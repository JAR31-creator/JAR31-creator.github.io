<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — Just Some Reviews</title>
<script>
  try {
    const saved = localStorage.getItem('theme');
    if(saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  } catch(e) {}
</script>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    color-scheme:light;
    --outer:#E8EBF0; --desk:#F4F5F8; --paper:#FFFFFF; --sheet-edge:#E3E6EB; --surface:#FFFFFF;
    --ink:#1C1B19; --ink-soft:#575A61; --rule:#E6E8EC;
    --film:#2F6F6E; --game:#B3452F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --outer:#080807; --desk:#161513; --paper:#211F1C; --sheet-edge:#322F2A; --surface:#262520;
      --ink:#ECE7DD; --ink-soft:#A8A298; --rule:#37342F;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --outer:#080807; --desk:#161513; --paper:#211F1C; --sheet-edge:#322F2A; --surface:#262520;
    --ink:#ECE7DD; --ink-soft:#A8A298; --rule:#37342F;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;display:flex;align-items:flex-start;justify-content:center;padding:clamp(24px, 8vh, 80px) 14px 40px;}
  .card{width:100%;max-width:440px;background:var(--paper);border:1px solid var(--sheet-edge);border-top:3px solid var(--ink);border-radius:14px;padding:30px 28px 26px;}
  .brand{display:block;font-size:0.72rem;letter-spacing:0.08em;color:var(--ink-soft);text-decoration:none;margin-bottom:6px;}
  h1{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:600;font-size:1.7rem;margin:0 0 6px;}
  .sub{margin:0 0 20px;color:var(--ink-soft);font-size:0.92rem;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:0.8rem;font-weight:600;}
  .pw-wrap{position:relative;display:block;}
  .pw-wrap input{width:100%;font-family:inherit;font-size:16px;font-weight:400;padding:10px 64px 10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);}
  .pw-wrap input:focus{outline:none;border-color:var(--ink-soft);}
  .pw-show{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font:inherit;font-size:0.78rem;font-weight:600;color:var(--ink-soft);cursor:pointer;padding:6px 8px;}
  .pw-meter{margin:-4px 0 14px;font-size:0.78rem;}
  .pw-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px;}
  .pw-bars i{height:5px;border-radius:3px;background:var(--rule);transition:background-color .2s;}
  .pw-label{font-weight:600;margin-bottom:4px;}
  .pw-label:empty{display:none;}
  .pw-checks{list-style:none;padding:0;margin:0 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;color:var(--ink-soft);}
  .pw-checks li::before{content:'\25CB';display:inline-block;width:1.1em;}
  .pw-checks li.ok{color:var(--ink);}
  .pw-checks li.ok::before{content:'\2713';color:var(--film);font-weight:700;}
  .pw-tip{color:var(--ink-soft);}
  .pw-match{font-size:0.78rem;margin:-6px 0 12px;}
  .pw-match:empty{display:none;}
  .pw-match.ok{color:var(--film);} .pw-match.bad{color:var(--game);}
  .primary{display:block;width:100%;font-family:inherit;font-size:0.95rem;font-weight:600;background:var(--ink);color:var(--paper);border:none;border-radius:22px;padding:12px 16px;cursor:pointer;margin-top:6px;}
  .primary:disabled{opacity:.5;cursor:default;}
  button{-webkit-tap-highlight-color:transparent;}
  .primary:active:not(:disabled){transform:scale(.98);}
  .primary:focus-visible, .pw-show:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  #status{font-size:0.86rem;margin-top:12px;color:var(--game);}
  #status:empty{display:none;}
  #status.ok{color:var(--film);}
  .back{display:inline-block;margin-top:16px;color:var(--ink);font-size:0.9rem;}
  [hidden]{display:none !important;}
  @media (max-width: 420px){ .pw-checks{grid-template-columns:1fr;} .card{padding:24px 18px 20px;} }
</style>
</head>
<body>

<main class="card">
  <a class="brand" href="/">JUST SOME REVIEWS</a>
  <h1>Set a new password</h1>
  <p class="sub" id="intro">Choose a new password for your account.</p>

  <form id="reset-form" novalidate hidden>
    <label class="field"><span>New password</span>
      <span class="pw-wrap"><input id="pw" type="password" autocomplete="new-password"><button type="button" class="pw-show" data-for="pw" aria-label="Show password">Show</button></span>
    </label>
    <div class="pw-meter" aria-live="polite">
      <div class="pw-bars"><i></i><i></i><i></i><i></i></div>
      <div class="pw-label"></div>
      <ul class="pw-checks"></ul>
      <div class="pw-tip"></div>
    </div>
    <label class="field"><span>Confirm new password</span>
      <span class="pw-wrap"><input id="pw2" type="password" autocomplete="new-password"><button type="button" class="pw-show" data-for="pw2" aria-label="Show password">Show</button></span>
    </label>
    <div class="pw-match" aria-live="polite"></div>
    <button type="submit" class="primary">Update password</button>
  </form>

  <div id="status" role="alert"></div>
  <a class="back" id="back-link" href="/" hidden>Back to Just Some Reviews</a>
</main>

<script>
  const SUPABASE_URL = "https://lzktxoizovfjgkxkpbhw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6a3R4b2l6b3ZmamdreGtwYmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDA3MDYsImV4cCI6MjEwNTg3NjcwNn0.NUWMnrx3XGoaDjQQovP5R100CDQL4Bk4Bix7kr52fJY";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storageKey: 'sb-reset-auth' }
  });

  function passwordStrength(pw, first, last, email){
    const checks = [
      { ok: pw.length >= 8, label: '8+ characters' },
      { ok: /[a-z]/.test(pw) && /[A-Z]/.test(pw), label: 'Upper & lowercase' },
      { ok: /\d/.test(pw), label: 'A number' },
      { ok: /[^A-Za-z0-9]/.test(pw), label: 'A symbol (! # ?)' }
    ];
    const lower = pw.toLowerCase();
    const emailName = (email || '').split('@')[0];
    const personal = [first, last, emailName, ...emailName.split(/[^a-z0-9]+/i)] // "maya.chen" also checks "maya" and "chen"
      .filter(x => x && x.trim().length >= 3)
      .some(x => lower.includes(x.trim().toLowerCase()));
    const common = /^(password|passw0rd|123456|12345678|qwerty|letmein|welcome|iloveyou|admin|abc123|111111|monkey|dragon)/i.test(pw);
    let score = checks.filter(c => c.ok).length + (pw.length >= 12 ? 1 : 0);
    if(pw.length < 8 || personal || common) score = Math.min(score, 1);
    const level = score <= 1 ? 1 : score === 2 ? 2 : score === 3 ? 3 : 4;
    const names = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    const colors = ['', 'var(--game)', '#C98423', '#6E9A3A', 'var(--film)'];
    let tip;
    if(common) tip = "That's one of the most common passwords. Try something more unique.";
    else if(personal) tip = 'Avoid using your name or email in your password.';
    else if(!checks[0].ok) tip = 'Keep going: use at least 8 characters.';
    else if(!checks[1].ok) tip = 'Tip: mix in UPPER and lowercase letters.';
    else if(!checks[2].ok) tip = 'Tip: add a number.';
    else if(!checks[3].ok) tip = 'Tip: add a symbol like ! # or ?';
    else if(pw.length < 12) tip = 'Strong! Making it 12+ characters is even better.';
    else tip = 'Great password.';
    return { level, name: names[level], color: colors[level], tip, checks };
  }
  // Has this password shown up in a known data breach? Uses the free Have I Been Pwned service.
  // Only the first 5 characters of the password's SHA-1 fingerprint are sent; the password never leaves the device.
  async function timesPasswordLeaked(password){
    try {
      const digest = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(password));
      const hash = [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      const res = await fetch('https://api.pwnedpasswords.com/range/' + hash.slice(0, 5));
      if(!res.ok) return 0;
      const match = (await res.text()).split('\n').find(line => line.startsWith(hash.slice(5)));
      return match ? (parseInt(match.split(':')[1], 10) || 0) : 0;
    } catch(e) {
      return 0; // if the check can't run (offline, blocked), don't stop the person from continuing
    }
  }
  const LEAKED_PASSWORD_MESSAGE = "This password has appeared in a known data breach, which makes it easy for attackers to guess. Please choose a different one.";

  const form = document.getElementById('reset-form');
  const pw = document.getElementById('pw');
  const pw2 = document.getElementById('pw2');
  const status = document.getElementById('status');
  const bars = form.querySelectorAll('.pw-bars i');
  const label = form.querySelector('.pw-label');
  const checksEl = form.querySelector('.pw-checks');
  const tip = form.querySelector('.pw-tip');
  const match = form.querySelector('.pw-match');
  let accountEmail = '';

  function setStatus(msg, ok){ status.textContent = msg || ''; status.classList.toggle('ok', !!ok); }

  function updateMeter(){
    const s = passwordStrength(pw.value, '', '', accountEmail);
    checksEl.innerHTML = s.checks.map(c => `<li class="${c.ok ? 'ok' : ''}">${c.label}</li>`).join('');
    if(!pw.value){
      bars.forEach(b => { b.style.background = ''; });
      label.textContent = '';
      tip.textContent = 'Use 8 or more characters with a mix of letters, numbers, and symbols.';
      return;
    }
    bars.forEach((b, i) => { b.style.background = i < s.level ? s.color : ''; });
    label.textContent = 'Strength: ' + s.name;
    label.style.color = s.color;
    tip.textContent = s.tip;
  }
  function updateMatch(){
    if(!pw2.value){ match.textContent = ''; match.className = 'pw-match'; return; }
    const same = pw.value === pw2.value;
    match.textContent = same ? '\u2713 Passwords match' : "Passwords don't match yet";
    match.className = 'pw-match ' + (same ? 'ok' : 'bad');
  }
  pw.addEventListener('input', () => { updateMeter(); updateMatch(); setStatus(''); });
  pw2.addEventListener('input', () => { updateMatch(); setStatus(''); });
  form.querySelectorAll('.pw-show').forEach(btn => btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.for);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? 'Show' : 'Hide';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  }));

  // The link in the email signs the person in for this one purpose; if it's missing or expired, say so up front
  async function start(){
    const { data } = await sb.auth.getSession();
    if(!data.session){
      document.getElementById('intro').textContent = "This reset link has expired or was already used.";
      setStatus('Go back to the site, select Log in, then "Forgot password?" to get a new link.');
      document.getElementById('back-link').hidden = false;
      return;
    }
    accountEmail = data.session.user.email || '';
    if(accountEmail) document.getElementById('intro').textContent = 'Choose a new password for ' + accountEmail + '.';
    form.hidden = false;
    updateMeter();
    pw.focus();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(pw.value.length < 8) return setStatus('Your new password needs at least 8 characters.');
    if(pw.value !== pw2.value) return setStatus("Your passwords don't match. Retype the confirmation.");
    const submit = form.querySelector('.primary');
    submit.disabled = true;
    submit.textContent = 'Checking password…';
    if(await timesPasswordLeaked(pw.value)){
      submit.disabled = false;
      submit.textContent = 'Update password';
      return setStatus(LEAKED_PASSWORD_MESSAGE);
    }
    submit.textContent = 'Updating…';
    const { error } = await sb.auth.updateUser({ password: pw.value });
    submit.disabled = false;
    submit.textContent = 'Update password';
    if(error) return setStatus(error.message.includes('different') ? 'Your new password needs to be different from your old one.' : "Couldn't update your password: " + error.message);
    form.hidden = true;
    document.getElementById('intro').textContent = 'All set!';
    setStatus('Your password has been updated. You can now log in with it.', true);
    document.getElementById('back-link').hidden = false;
    await sb.auth.signOut(); // this page's sign-in was only for the reset
  });

  start();
</script>

</body>
</html>
