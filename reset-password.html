<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Just Some Reviews</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body{font-family:sans-serif;max-width:420px;margin:80px auto;padding:0 20px;color:#1C1B19;}
  h1{font-size:1.4rem;}
  input{width:100%;padding:8px;margin-bottom:12px;font-size:0.95rem;box-sizing:border-box;}
  button{padding:8px 16px;cursor:pointer;}
  #status{margin-top:10px;font-size:0.9rem;}
</style>
</head>
<body>

<h1>Set a new password</h1>
<form id="reset-form">
  <input id="new-password" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required>
  <button type="submit">Update password</button>
</form>
<div id="status"></div>

<script>
  const SUPABASE_URL = "https://lzktxoizovfjgkxkpbhw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6a3R4b2l6b3ZmamdreGtwYmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDA3MDYsImV4cCI6MjEwNTg3NjcwNn0.NUWMnrx3XGoaDjQQovP5R100CDQL4Bk4Bix7kr52fJY";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('status');
    const newPassword = document.getElementById('new-password').value;
    const { error } = await sb.auth.updateUser({ password: newPassword });
    if(error){
      status.textContent = "Error: " + error.message + " — the reset link may have expired, request a new one.";
    } else {
      status.textContent = "Password updated! You can close this tab and log in with your new password.";
      document.getElementById('reset-form').style.display = 'none';
    }
  });
</script>

</body>
</html>
