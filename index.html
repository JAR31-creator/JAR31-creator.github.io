<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Some Reviews</title>
<meta name="theme-color" content="#E7E2D6">
<script>
  try {
    const saved = localStorage.getItem('theme');
    if(saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  } catch(e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root{
    color-scheme:light;
    --outer:#D2CAB9; --frame-edge:#C4BBA8;
    --desk:#E7E2D6; --paper:#FBF9F5; --sheet-edge:#D8D1C3;
    --ink:#1C1B19; --ink-soft:#5A5751; --rule:#DEDACF;
    --surface:#FFFFFF; --bubble:#EFEBE2; --tint:#F1EDE3;
    --nav-bg:rgba(231,226,214,0.92); --shadow:rgba(28,27,25,0.15);
    --sk-a:#ECE8DF; --sk-b:#F4F1EA; --fresh:#F3E3B5;
    --film:#2F6F6E; --game:#B3452F; --music:#6B4E8E; --tv:#B08B1E; --post:#4A6680;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --outer:#080807; --frame-edge:#3A3631;
      --desk:#161513; --paper:#211F1C; --sheet-edge:#322F2A;
      --ink:#ECE7DD; --ink-soft:#A8A298; --rule:#37342F;
      --surface:#262520; --bubble:#2E2C28; --tint:#25231F;
      --nav-bg:rgba(22,21,19,0.92); --shadow:rgba(0,0,0,0.45);
      --sk-a:#262420; --sk-b:#302D29; --fresh:#4A3F22;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --outer:#080807; --frame-edge:#3A3631;
      --desk:#161513; --paper:#211F1C; --sheet-edge:#322F2A;
      --ink:#ECE7DD; --ink-soft:#A8A298; --rule:#37342F;
    --surface:#262520; --bubble:#2E2C28; --tint:#25231F;
    --nav-bg:rgba(22,21,19,0.92); --shadow:rgba(0,0,0,0.45);
    --sk-a:#262420; --sk-b:#302D29; --fresh:#4A3F22;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--outer);transition:background-color .2s, color .2s;color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;}
  .page-frame{display:flow-root;max-width:960px;margin:0 auto;min-height:100vh;background:var(--desk);border-left:1px solid var(--frame-edge);border-right:1px solid var(--frame-edge);transition:background-color .2s;}
  header{width:calc(100% - 48px);max-width:632px;margin:28px auto 18px;padding:64px 28px 26px;background:var(--paper);border:1px solid var(--sheet-edge);border-top:3px solid var(--ink);border-radius:3px;}
  .site-logo{position:absolute;top:12px;left:14px;width:44px;height:44px;display:block;z-index:25;border-radius:12px;transition:transform .15s ease;}
  .site-logo svg{display:block;width:100%;height:100%;}
  .site-logo:hover{transform:translateY(-2px) rotate(-3deg);}
  .site-logo:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  @media (min-width: 900px){
    header{padding-top:36px;}
    .site-logo{position:fixed;top:24px;left:max(16px, calc(50% - 440px));width:72px;height:72px;border-radius:18px;}
  }
  @media (max-width: 960px){ .page-frame{border-left:none;border-right:none;} }
  .home-fab{display:none;}
  @media (max-width: 899px){
    .home-fab{display:block;position:fixed;right:calc(14px + env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));width:54px;height:54px;padding:0;border:none;background:none;border-radius:16px;z-index:40;cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.3);opacity:0;transform:translateY(18px) scale(.9);pointer-events:none;transition:opacity .2s ease, transform .2s ease;-webkit-tap-highlight-color:transparent;}
    .home-fab.show{opacity:1;transform:none;pointer-events:auto;}
    .home-fab:active{transform:scale(.94);}
    .home-fab > svg{display:block;width:100%;height:100%;}
    .fab-arrow{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--paper);color:var(--ink);border:1px solid var(--sheet-edge);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);}
    .fab-arrow svg{width:12px;height:12px;}
  }
  h1{font-family:'Newsreader',serif;font-weight:600;font-size:2.4rem;margin:0 0 6px;}
  header p{color:var(--ink-soft);margin:0;font-size:0.95rem;}
  nav{max-width:680px;margin:0 auto;padding:0 24px 32px;display:flex;gap:18px;padding-bottom:14px;}
  nav button{font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:500;background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:4px 0;border-bottom:2px solid transparent;}
  nav button.active{color:var(--ink);border-bottom-color:var(--ink);}
  nav button{transition:transform .15s ease, color .15s ease, border-color .15s ease;}
  @media (hover: hover){
    nav button:hover{transform:translateY(-2px);color:var(--ink);}
    nav button:not(.active):hover{border-bottom-color:var(--ink-soft);}
  }
  nav button:focus-visible{transform:translateY(-2px);}
  main{max-width:680px;margin:0 auto;padding:8px 24px 64px;}
  .entry{background:var(--paper);border:1px solid var(--sheet-edge);border-top:3px solid var(--cat, var(--sheet-edge));border-radius:3px;padding:26px 28px 22px;margin-bottom:18px;display:flow-root;}
  .entry[data-cat="film"]{--cat:var(--film);} .entry[data-cat="tv"]{--cat:var(--tv);} .entry[data-cat="game"]{--cat:var(--game);}
  .entry[data-cat="music"]{--cat:var(--music);} .entry[data-cat="announcement"]{--cat:var(--ink);} .entry[data-cat="post"]{--cat:var(--post);}
  .entry-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:0.8rem;color:var(--ink-soft);}
  .tag{font-size:0.72rem;font-weight:600;padding:2px 8px;border-radius:2px;color:#fff;}
  .tag.film{background:var(--film);} .tag.game{background:var(--game);} .tag.music{background:var(--music);} .tag.tv{background:var(--tv);} .tag.announcement{background:var(--ink);color:var(--paper);} .tag.post{background:var(--post);}
  .entry h2{font-family:'Newsreader',serif;font-weight:600;font-style:italic;font-size:1.5rem;margin:0 0 4px;}
  .subject{font-size:0.88rem;color:var(--ink-soft);margin-bottom:10px;}
  .stars{position:relative;display:inline-block;font-size:1.6rem;letter-spacing:3px;margin-bottom:10px;line-height:1;}
  .stars .stars-back{color:var(--rule);}
  .stars .stars-front{color:var(--ink);position:absolute;top:0;left:0;overflow:hidden;white-space:nowrap;}
  .entry .body{margin:0 0 16px;max-width:62ch;}
  .rich p{margin:0;}
  .rich ul, .rich ol{margin:0;padding-left:1.4em;}
  .rich b, .rich strong{font-weight:700;}
  .actions{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .like-btn{font-family:'Inter',sans-serif;font-size:0.85rem;background:none;border:1px solid var(--rule);border-radius:20px;padding:5px 14px;cursor:pointer;color:var(--ink);}
  .like-btn.liked{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  [hidden]{display:none !important;}
  .comments{clear:both;margin-top:4px;padding-top:14px;border-top:1px solid var(--rule);}
  .comment{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:0.88rem;}
  .comment.reply{padding:6px 0 0;}
  .avatar{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:600;font-size:0.85rem;display:flex;align-items:center;justify-content:center;user-select:none;}
  .comment.reply .avatar{width:26px;height:26px;font-size:0.72rem;}
  .comment-main{flex:1;min-width:0;}
  .bubble{display:inline-block;max-width:100%;background:var(--bubble);border-radius:16px;padding:7px 13px;overflow-wrap:anywhere;}
  .bubble.fresh{animation:fresh 2.6s ease-out;}
  @keyframes fresh{0%,35%{background:var(--fresh);}100%{background:var(--bubble);}}
  .bubble .who{display:block;font-weight:600;font-size:0.8rem;}
  .poll{clear:both;margin:4px 0 18px;padding:14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);max-width:520px;}
  .poll-q{font-weight:600;margin-bottom:10px;}
  .poll-opts{display:flex;flex-direction:column;gap:8px;}
  .poll-opt{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:40px;padding:8px 14px;border:1px solid var(--rule);border-radius:20px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:0.9rem;text-align:left;cursor:pointer;overflow:hidden;}
  .poll-opt:hover:not([disabled]){border-color:var(--ink-soft);}
  .poll-opt.result{border-radius:8px;}
  .poll-opt[disabled]{cursor:default;}
  .poll-fill{position:absolute;top:0;bottom:0;left:0;background:var(--ink);opacity:.08;transition:width .6s cubic-bezier(.2,.7,.2,1);}
  .poll-opt.mine{border-color:var(--cat, var(--ink));}
  .poll-opt.mine .poll-fill{background:var(--cat, var(--ink));opacity:.24;}
  .poll-label, .poll-pct{position:relative;}
  .poll-opt.mine .poll-label{font-weight:600;}
  .poll-check{color:var(--cat, var(--ink));}
  .poll-pct{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:0.85rem;}
  .poll-note{margin-top:10px;font-size:0.8rem;color:var(--ink-soft);}
  .poll-note button{background:none;border:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;}
  .owner-badge{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 7px 1px 5px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:0.66rem;font-weight:600;vertical-align:1px;}
  .owner-badge svg{width:10px;height:10px;}
  .comment .comment-img{display:block;max-width:220px;max-height:160px;object-fit:contain;border:1px solid var(--rule);border-radius:12px;margin:6px 0 2px;background:var(--surface);cursor:zoom-in;}
  .comment-actions{display:flex;gap:14px;align-items:center;margin:4px 0 0 12px;font-size:0.76rem;color:var(--ink-soft);}
  .comment-actions time{cursor:default;}
  .comment-actions button{background:none;border:none;color:var(--ink-soft);font-size:0.76rem;cursor:pointer;padding:2px;display:flex;align-items:center;gap:3px;border-radius:4px;}
  .comment-actions button:hover{color:var(--ink);}
  .comment-actions button.liked{color:var(--game);}
  .like-count-static{display:flex;align-items:center;gap:3px;}
  .thread-toggle{background:none;border:none;padding:0;margin:6px 0 0 12px;font-family:inherit;font-size:0.78rem;font-weight:600;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .thread-toggle::before{content:'';width:22px;height:1px;background:currentColor;}
  .thread-toggle:hover{color:var(--ink);}
  .edit-form{display:flex;flex-direction:column;gap:6px;max-width:440px;}
  .edit-form textarea{font-family:inherit;font-size:0.88rem;line-height:1.4;padding:8px 13px;border:1px solid var(--rule);border-radius:16px;min-height:40px;resize:none;background:var(--surface);color:var(--ink);}
  .edit-row{display:flex;gap:6px;}
  .edit-row button{font-family:inherit;font-size:0.8rem;border:none;border-radius:16px;padding:5px 12px;cursor:pointer;background:var(--bubble);color:var(--ink);}
  .edit-row button[type="submit"]{background:var(--ink);color:var(--paper);}
  .comment-form, .reply-form{display:flex;flex-direction:column;gap:6px;}
  .comment-form{margin-top:14px;max-width:520px;}
  .reply-form{margin-top:8px;max-width:440px;}
  .comment-input-wrap{position:relative;}
  .comment-input-wrap textarea{display:block;width:100%;min-height:42px;max-height:220px;padding:10px 70px 10px 14px;font-family:inherit;font-size:0.88rem;line-height:1.4;border:1px solid var(--rule);border-radius:21px;background:var(--surface);color:var(--ink);resize:none;}
  .comment-input-wrap textarea:focus{outline:none;border-color:var(--ink-soft);}
  .comment-toolbar{position:absolute;bottom:10px;right:12px;display:flex;gap:8px;}
  .comment-toolbar button{background:none;border:none;cursor:pointer;padding:2px;line-height:1;display:flex;align-items:center;color:var(--ink-soft);border-radius:50%;}
  .comment-toolbar button:hover{color:var(--ink);}
  .comment-input-wrap.has-gif textarea{padding-right:100px;}
  .gif-popup{position:absolute;bottom:calc(100% + 6px);right:0;width:min(340px, calc(100vw - 40px));background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:8px;box-shadow:0 6px 18px var(--shadow);z-index:6;display:none;flex-direction:column;gap:8px;}
  .gif-popup.open{display:flex;animation:rise .14s ease-out;}
  .gif-search{font-family:inherit;font-size:0.85rem;padding:8px 12px;border:1px solid var(--rule);border-radius:18px;background:var(--paper);color:var(--ink);}
  .gif-search:focus{outline:none;border-color:var(--ink-soft);}
  .gif-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start;height:280px;overflow-y:auto;overflow-x:hidden;}
  .gif-item{display:block;width:100%;height:110px;padding:0;border:none;background:var(--tint);border-radius:8px;overflow:hidden;cursor:pointer;}
  .gif-item img{display:block;width:100%;height:100%;object-fit:cover;}
  .gif-msg{grid-column:1 / -1;}
  .emoji-popup.below, .gif-popup.below{bottom:auto;top:calc(100% + 6px);}
  .gif-item:hover, .gif-item:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
  .gif-msg{column-span:all;font-size:0.8rem;color:var(--ink-soft);text-align:center;padding:40px 12px;margin:0;}
  .gif-attrib{font-size:0.7rem;color:var(--ink-soft);text-align:right;padding-right:4px;}
  .gif-thumb{height:30px;width:auto;border-radius:4px;vertical-align:middle;margin-right:8px;}
  .emoji-popup{position:absolute;bottom:calc(100% + 6px);right:0;width:min(340px, calc(100vw - 40px));background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0;overflow:hidden;display:none;box-shadow:0 6px 18px var(--shadow);z-index:6;}
  .emoji-popup.open{display:block;animation:rise .14s ease-out;}
  .file-indicator{font-size:0.76rem;color:var(--ink-soft);padding-left:12px;}
  .file-indicator:empty{display:none;}
  .remove-file{background:none;border:none;padding:0;margin-left:6px;font:inherit;color:var(--game);text-decoration:underline;cursor:pointer;}
  .post-btn{align-self:flex-start;font-family:inherit;font-size:0.82rem;font-weight:600;background:var(--ink);color:var(--paper);border:none;border-radius:18px;padding:6px 16px;cursor:pointer;transition:opacity .15s;}
  .post-btn:disabled{opacity:0.35;cursor:default;}
  .login-hint{font-size:0.82rem;color:var(--ink-soft);margin-top:10px;}
  #lightbox{display:none;position:fixed;inset:0;background:rgba(20,19,17,0.88);z-index:1000;align-items:center;justify-content:center;cursor:zoom-out;}
  #lightbox.open{display:flex;}
  #lightbox img{max-width:90%;max-height:90%;border-radius:4px;}
  .empty-state, .loading{padding:60px 0;color:var(--ink-soft);font-style:italic;}
  footer{max-width:680px;margin:0 auto;padding:0 24px 60px;color:var(--ink-soft);font-size:0.8rem;}
  #authbar{max-width:680px;margin:0 auto 10px;padding:4px 24px 8px;font-size:0.85rem;color:var(--ink-soft);}
  #authbar button{font-family:'Inter',sans-serif;font-size:0.85rem;background:none;border:none;text-decoration:underline;cursor:pointer;color:var(--ink);padding:0;}
  #auth-forms{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  #auth-forms input{font-family:'Inter',sans-serif;font-size:0.85rem;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;}
  #auth-forms button{background:var(--ink);color:var(--paper);border-radius:20px;padding:6px 14px;text-decoration:none;}
  #auth-status{width:100%;font-size:0.8rem;color:var(--game);}
  .entry-head.has-cover{display:grid;grid-template-columns:minmax(0, 1fr) auto;grid-template-rows:auto 1fr;grid-template-areas:"titles cover" "body cover";column-gap:24px;align-items:start;margin-bottom:12px;}
  .entry-head.has-cover .entry-titles{grid-area:titles;}
  .entry-head.has-cover .cover{grid-area:cover;justify-self:end;}
  .entry-head.has-cover .body{grid-area:body;margin-bottom:4px;}
  .entry-head:empty, .entry-titles:empty{display:none;}
  .cover{position:relative;margin:0;cursor:zoom-in;touch-action:manipulation;user-select:none;border-radius:4px;}
  .cover img{display:block;width:auto;height:auto;max-width:150px;max-height:190px;border:1px solid var(--rule);border-radius:4px;transition:transform .18s ease, box-shadow .18s ease;}
  .cover:hover img{transform:translateY(-4px);box-shadow:0 8px 16px var(--shadow);}
  .burst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2rem;opacity:0;pointer-events:none;}
  .burst.go{animation:burst .8s ease-out;}
  @keyframes burst{0%{opacity:0;transform:scale(.3);}15%{opacity:1;transform:scale(1.2);}30%{transform:scale(.95);}45%{transform:scale(1);}75%{opacity:1;}100%{opacity:0;transform:scale(1.05);}}
  .heart{display:inline-block;}
  @keyframes pop{0%{transform:scale(1);}35%{transform:scale(1.4);}100%{transform:scale(1);}}
  .pop svg, .pop .heart{animation:pop .35s ease-out;}
  @keyframes rise{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  #lightbox.open{animation:fade .15s ease-out;}
  button:active:not(:disabled){transform:scale(0.96);}
  button, a, .cover{-webkit-tap-highlight-color:transparent;}
  button:focus-visible, textarea:focus-visible, input:focus-visible, .cover:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  nav{position:sticky;top:0;z-index:20;background:var(--nav-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-top:12px;}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:22px;font-size:0.85rem;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:1100;max-width:calc(100% - 32px);}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  #toast.error{background:var(--game);}
  .skeleton{background:var(--paper);border:1px solid var(--sheet-edge);border-top-width:3px;border-radius:3px;padding:26px 28px;margin-bottom:18px;}
  .sk{background:linear-gradient(90deg,var(--sk-a) 25%,var(--sk-b) 50%,var(--sk-a) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:4px;margin-bottom:10px;}
  .sk-meta{width:120px;height:12px;} .sk-title{width:55%;height:22px;} .sk-line{height:12px;} .w90{width:90%;} .w70{width:70%;}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
  @media (prefers-reduced-motion: reduce){ *, *::before, *::after{animation:none !important;transition:none !important;} }
  header{position:relative;}
  .settings{position:absolute;top:16px;right:24px;}
  #settings-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:8px;border-radius:50%;display:flex;}
  #settings-btn:hover{color:var(--ink);background:var(--tint);}
  #settings-panel{position:absolute;top:calc(100% + 6px);right:0;width:250px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px;box-shadow:0 8px 24px var(--shadow);z-index:30;animation:rise .14s ease-out;}
  .settings-label{font-size:0.8rem;font-weight:600;margin-bottom:8px;}
  .segmented{display:flex;background:var(--tint);border-radius:10px;padding:3px;gap:2px;}
  .segmented button{flex:1;font-family:inherit;font-size:0.82rem;background:none;border:none;border-radius:8px;padding:7px 0;color:var(--ink-soft);cursor:pointer;}
  .segmented button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px var(--shadow);}
  #auth-forms input{background:var(--surface);color:var(--ink);}
  #authbar a{color:var(--ink);}
  nav{overflow-x:auto;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:none;white-space:nowrap;}
  @media (hover: none){ .cover:hover img{transform:none;box-shadow:none;} }
  @media (pointer: coarse){
    .comment-actions{gap:6px;}
    .comment-actions button{padding:7px;}
    .comment-actions time{padding-right:4px;}
    .thread-toggle{padding:6px 0;}
    .comment-toolbar button{padding:5px;}
  }
  @media (max-width: 560px){
    header{width:calc(100% - 20px);margin:10px auto 14px;padding:60px 18px 20px;}
    .settings{top:8px;right:10px;}
    h1{font-size:2rem;padding-right:36px;}
    nav, main, footer, #authbar{padding-left:16px;padding-right:16px;}
    nav{gap:20px;}
    .entry-head.has-cover{grid-template-areas:"titles cover" "body body";column-gap:14px;row-gap:12px;}

  // ---------- Password strength ----------
  function passwordStrength(pw, first, last, email){
    const checks = [
      { ok: pw.length >= 8, label: '8+ characters' },
      { ok: /[a-z]/.test(pw) && /[A-Z]/.test(pw), label: 'Upper & lowercase' },
      { ok: /\d/.test(pw), label: 'A number' },
      { ok: /[^A-Za-z0-9]/.test(pw), label: 'A symbol (! # ?)' }
    ];
    const lower = pw.toLowerCase();
    const emailName = (email || '').split('@')[0];
    const personal = [first, last, emailName, ...emailName.split(/[^a-z0-9]+/i)] // "maya.chen" also checks "maya" and "chen"
      .filter(x => x && x.trim().length >= 3)
      .some(x => lower.includes(x.trim().toLowerCase()));
    const common = /^(password|passw0rd|123456|12345678|qwerty|letmein|welcome|iloveyou|admin|abc123|111111|monkey|dragon)/i.test(pw);
    let score = checks.filter(c => c.ok).length + (pw.length >= 12 ? 1 : 0);
    if(pw.length < 8 || personal || common) score = Math.min(score, 1);
    const level = score <= 1 ? 1 : score === 2 ? 2 : score === 3 ? 3 : 4;
    const names = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    const colors = ['', 'var(--game)', '#C98423', '#6E9A3A', 'var(--film)'];
    let tip;
    if(common) tip = "That's one of the most common passwords. Try something more unique.";
    else if(personal) tip = 'Avoid using your name or email in your password.';
    else if(!checks[0].ok) tip = 'Keep going: use at least 8 characters.';
    else if(!checks[1].ok) tip = 'Tip: mix in UPPER and lowercase letters.';
    else if(!checks[2].ok) tip = 'Tip: add a number.';
    else if(!checks[3].ok) tip = 'Tip: add a symbol like ! # or ?';
    else if(pw.length < 12) tip = 'Strong! Making it 12+ characters is even better.';
    else tip = 'Great password.';
    return { level, name: names[level], color: colors[level], tip, checks };
  }

    removeTurnstile();

    const tryRender = (attempt) => {
      if(!document.body.contains(el)) return;
      if(window.turnstile){
        turnstileWidgetId = turnstile.render(el, {
          sitekey: TURNSTILE_SITE_KEY,
          callback: (token) => { turnstileToken = token; },
          'expired-callback': () => { turnstileToken = null; }
        });
      } else if(attempt < 50){
        setTimeout(() => tryRender(attempt + 1), 200); // the Turnstile script may still be loading
      }
    };

  let checkEmailAddress = '';

  function wireSignup(body){
    const $ = (id) => body.querySelector('#' + id);
    const first = $('su-first'), last = $('su-last'), email = $('su-email'), pw = $('su-pw'), pw2 = $('su-pw2');
    const bars = body.querySelectorAll('.pw-bars i');
    const label = body.querySelector('.pw-label');
    const checksEl = body.querySelector('.pw-checks');
    const tip = body.querySelector('.pw-tip');
    const match = body.querySelector('.pw-match');
    const picker = wireAvatarPicker(body, () => first.value);

    const updateMeter = () => {
      const s = passwordStrength(pw.value, first.value, last.value, email.value);
      checksEl.innerHTML = s.checks.map(c => `<li class="${c.ok ? 'ok' : ''}">${c.label}</li>`).join('');
      if(!pw.value){
        bars.forEach(b => { b.style.background = ''; });
        label.textContent = '';
        tip.textContent = 'Use 8 or more characters with a mix of letters, numbers, and symbols.';
        return;
      }
      bars.forEach((b, i) => { b.style.background = i < s.level ? s.color : ''; });
      label.textContent = 'Strength: ' + s.name;
      label.style.color = s.color;
      tip.textContent = s.tip;
    };
    const updateMatch = () => {
      if(!pw2.value){ match.textContent = ''; match.className = 'pw-match'; return; }
      const same = pw.value === pw2.value;
      match.textContent = same ? '\u2713 Passwords match' : "Passwords don't match yet";
      match.className = 'pw-match ' + (same ? 'ok' : 'bad');
    };
    [first, last, email, pw].forEach(i => i.addEventListener('input', updateMeter));
    [pw, pw2].forEach(i => i.addEventListener('input', updateMatch));
    first.addEventListener('input', picker.update); // keeps the "initial" option showing their first letter
    updateMeter();

    body.querySelector('#auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = first.value.trim(), l = last.value.trim(), em = email.value.trim();
      if(!f || !l) return setStatus('Enter your first and last name.');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return setStatus('Enter a valid email address.');
      if(pw.value.length < 8) return setStatus('Your password needs at least 8 characters.');
      if(pw.value !== pw2.value) return setStatus("Your passwords don't match. Retype the confirmation.");
      if(!turnstileToken) return setStatus('Complete the verification check above.');
      const submit = body.querySelector('.dlg-primary');
      submit.disabled = true;
      submit.textContent = 'Creating account…';
      setStatus('');
      const avatar = picker.current();
      const { data, error } = await sb.auth.signUp({
        email: em, password: pw.value,
        options: {
          captchaToken: turnstileToken,
          data: { display_name: `${f} ${l}`, first_name: f, last_name: l, avatar_icon: avatar.icon || null, avatar_color: avatar.color },
          emailRedirectTo: window.location.origin + '/'
        }
      });
      resetTurnstile();
      submit.disabled = false;
      submit.textContent = 'Create account';
      if(error) return setStatus(error.message);
      if(!data.session){
        checkEmailAddress = em;
        renderAuthDialog('check-email');
        focusDialog();
        return;
      }
      session = data.session;
      profile = { display_name: `${f} ${l}`, avatar_icon: avatar.icon || null, avatar_color: avatar.color };
      PROFILES.set(session.user.id, profile);
      authDialog.close();
      showToast(`Welcome, ${f}!`);
      renderAuthBar(); loadAll();
    });
  }

  async function doLogin(){
    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-pw').value;
    if(!email || !password) return setStatus('Enter your email and password.');
    if(!turnstileToken) return setStatus('Complete the verification check above.');
    const submit = authDialog.querySelector('.dlg-primary');
    submit.disabled = true;
    submit.textContent = 'Logging in…';
    const { data, error } = await sb.auth.signInWithPassword({ email, password, options: { captchaToken: turnstileToken } });
    resetTurnstile();
    submit.disabled = false;
    submit.textContent = 'Log in';
    if(error) return setStatus(error.message);
    session = data.session;
    const { data: p } = await sb.from('profiles').select('display_name, avatar_icon, avatar_color').eq('id', session.user.id).single();
    profile = p;
    authDialog.close();
    showToast(`Welcome back${p?.display_name ? ', ' + p.display_name.split(' ')[0] : ''}!`);
    renderAuthBar(); loadAll();
  }

  async function forgotPassword(){
    const email = document.getElementById('li-email').value.trim();
    if(!email) return setStatus('Enter your email above first, then select "Forgot password?" again.');
    if(!turnstileToken) return setStatus('Complete the verification check above first.');
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
      captchaToken: turnstileToken
    });
    resetTurnstile();
    if(error) setStatus(error.message);
    else setStatus('Check your email for a password reset link.', true);
  }

  function scheduleAuthPrompt(){
    let seen = false;
    try { seen = sessionStorage.getItem('auth-prompt-seen') === '1'; } catch(e) {}
    if(session || seen) return;
    setTimeout(() => {
      if(session || authDialog.open) return;
      openAuthDialog('signup', { prompt: true });
    }, AUTH_PROMPT_DELAY_MS);

  let loadSeq = 0;
  async function loadAll(){
    const seq = ++loadSeq;
    const [{ data: reviews }, { data: comments }, { data: likes }, { data: commentLikes }, { data: profiles },
           { data: polls }, { data: pollOptions }, { data: pollTotals }, { data: myPollVotes }] = await Promise.all([
      sb.from('reviews').select('*').eq('status', 'published').order('created_at', {ascending:false}),
      sb.from('comments').select('*').order('created_at', {ascending:true}),
      sb.from('likes').select('review_id, type'),
      sb.from('comment_likes').select('comment_id, user_id'),
      sb.from('profiles').select('id, avatar_icon, avatar_color'),
      sb.from('polls').select('id, review_id, question, closed, ends_at'),
      sb.from('poll_options').select('id, poll_id, label, position'),
      sb.from('poll_totals').select('option_id, votes'),                                   // counts only, no names
      session ? sb.from('poll_votes').select('poll_id, option_id') : Promise.resolve({ data: [] }) // just your own vote
    ]);
    if(seq !== loadSeq) return; // a newer refresh already started; drop this stale one
    const totals = new Map((pollTotals || []).map(t => [t.option_id, t.votes]));
    const mine = new Map((myPollVotes || []).map(v => [v.poll_id, v.option_id]));
    const pollByReview = new Map();
    (polls || []).forEach(pl => pollByReview.set(pl.review_id, {
      ...pl,
      options: (pollOptions || []).filter(o => o.poll_id === pl.id).sort((a, b) => a.position - b.position)
        .map(o => ({ ...o, count: totals.get(o.id) || 0 })),
      myOptionId: mine.get(pl.id) || null
    }));
    PROFILES.clear();
    (profiles || []).forEach(p => PROFILES.set(p.id, p));

    ALL_REVIEWS = (reviews || []).map(r => ({
      ...r,
      comments: (comments || []).filter(c => c.review_id === r.id).map(c => {
        const cLikes = (commentLikes || []).filter(cl => cl.comment_id === c.id);
        return {
          ...c,
          likeCount: cLikes.length,
          likerIds: cLikes.map(cl => cl.user_id)
        };
      }),
      poll: pollByReview.get(r.id) || null,
      likeCount: (likes || []).filter(l => l.review_id === r.id && l.type === 'like').length,
      dislikeCount: (likes || []).filter(l => l.review_id === r.id && l.type === 'dislike').length
    }));

    renderFilters();
    render(currentFilter);
    schedulePollEnd();
  }

  // ---------- Poll end dates ----------
  function pollHasEnded(poll){ return !!poll.ends_at && new Date(poll.ends_at).getTime() <= Date.now(); }
  function formatPollDate(iso, withTime){
    const d = new Date(iso);
    return withTime
      ? d.toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }
  // Flip a poll to "ended" the moment its deadline passes, even if nobody refreshes the page
  let pollEndTimer = null;
  function schedulePollEnd(){
    clearTimeout(pollEndTimer);
    const now = Date.now();
    const next = ALL_REVIEWS.map(r => r.poll)
      .filter(p => p && p.ends_at && !p.closed)
      .map(p => new Date(p.ends_at).getTime())
      .filter(t => t > now)
      .sort((a, b) => a - b)[0];
    if(!next) return;
    pollEndTimer = setTimeout(() => { render(currentFilter); schedulePollEnd(); }, Math.min(next - now + 500, 86400000));
  }

  function renderFilters(){
    const cats = ['all', ...new Set(ALL_REVIEWS.map(r => r.category))];
    const nav = document.getElementById('filters');
    nav.innerHTML = cats.map(c =>
      `<button data-cat="${c}" class="${c===currentFilter?'active':''}">${c==='all'?'All':CATS[c]}</button>`
    ).join('');
    nav.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => { currentFilter = btn.dataset.cat; renderFilters(); render(currentFilter); });
    });
  }

  const ICONS = {
    like: (filled) => `<svg viewBox="0 0 20 20" width="15" height="15" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.4"><path d="M10 17s-6-3.6-6-8.2C4 6 6 4.5 8 4.5c1 0 2 .6 2 .6s1-.6 2-.6c2 0 4 1.5 4 4.3 0 4.6-6 8.2-6 8.2z"/></svg>`,

    edit: `<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.5 3.5l3 3L6 17H3v-3z" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
    delete: `<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 6h12" stroke-linecap="round"/><path d="M8 6V4h4v2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 6l0.7 10a1 1 0 0 0 1 0.9h5.6a1 1 0 0 0 1-0.9L14.5 6" stroke-linejoin="round"/></svg>`,
    smile: `<svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="8"/><circle cx="7" cy="8.2" r="0.9" fill="currentColor" stroke="none"/><circle cx="13" cy="8.2" r="0.9" fill="currentColor" stroke="none"/><path d="M6.5 12c1.2 1.6 5.8 1.6 7 0" stroke-linecap="round"/></svg>`,
    camera: `<svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="6.5" width="16" height="10.5" rx="2"/><path d="M7 6.5l1.3-2h3.4l1.3 2" stroke-linejoin="round"/><circle cx="10" cy="11.5" r="3"/></svg>`
  };
  ICONS.gif = `<svg viewBox="0 0 24 20" width="22" height="19" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="21" height="15" rx="3.5"/><text x="12" y="13.4" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="7.6" font-weight="700" fill="currentColor" stroke="none" letter-spacing="0.2">GIF</text></svg>`;
  const AVATAR_COLORS = ['#2F6F6E', '#B3452F', '#6B4E8E', '#B08B1E', '#5A5751'];
  let popTarget = null;               // which like button should play its "pop" on the next render
  const expandedThreads = new Set();  // comment ids whose replies are currently shown

  function avatarFor(name, userId){
    const p = userId ? PROFILES.get(userId) : null;
    return avatarHTML(name, p?.avatar_icon, p?.avatar_color);
  }

  function timeAgo(d){
    const secs = Math.max(0, (Date.now() - new Date(d).getTime()) / 1000);
    if(secs < 60) return 'Just now';
    const mins = Math.floor(secs / 60); if(mins < 60) return mins + 'm';
    const hrs = Math.floor(mins / 60);  if(hrs < 24) return hrs + 'h';
    const days = Math.floor(hrs / 24);  if(days < 7) return days + 'd';
    return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }

  let toastTimer = null;
  function showToast(msg, isError){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function renderComment(c, allComments, reviewId, depth){
    const replies = allComments.filter(x => x.parent_comment_id === c.id);
    const isOwner = session && c.user_id === session.user.id;
    const iAmSiteOwner = !!(session && session.user.id === OWNER_ID);
    const byOwner = c.user_id === OWNER_ID;
    const likedByMe = !!(session && c.likerIds.includes(session.user.id));
    const expanded = expandedThreads.has(c.id);
    const fullDate = new Date(c.created_at).toLocaleString('en-US', { dateStyle:'long', timeStyle:'short' });
    const likeLabel = likedByMe ? 'Unlike' : 'Like';
    const likeControl = session && profile
      ? `<button type="button" class="comment-like-btn ${likedByMe ? 'liked' : ''} ${popTarget === 'c-' + c.id ? 'pop' : ''}" data-id="${c.id}" title="${likeLabel}" aria-label="${likeLabel}" aria-pressed="${likedByMe}">${ICONS.like(likedByMe)}${c.likeCount ? `<span>${c.likeCount}</span>` : ''}</button>`
      : (c.likeCount ? `<span class="like-count-static" title="Likes">${ICONS.like(false)}<span>${c.likeCount}</span></span>` : '');
    const repliesLabel = expanded ? 'Hide replies' : `View ${replies.length} ${replies.length === 1 ? 'reply' : 'replies'}`;
    return `
      <div class="comment ${depth > 0 ? 'reply' : ''}" data-id="${c.id}">
        ${avatarFor(c.author, c.user_id)}
        <div class="comment-main">
          <div class="bubble"><span class="who">${escapeHtml(c.author)}${byOwner ? `<span class="owner-badge" title="Written by the site's author"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.2 2.2 4.8-5"/></svg>Author</span>` : ''}</span><span class="comment-text">${escapeHtml(c.body)}</span></div>
          ${c.image_url ? `<img class="comment-img" src="${c.image_url}" alt="Image shared by ${escapeHtml(c.author)}">` : ''}
          <div class="comment-actions">
            <time datetime="${c.created_at}" title="${fullDate}">${timeAgo(c.created_at)}</time>
            ${likeControl}
            ${session && profile ? `<button type="button" class="reply-btn" data-id="${c.id}" data-review="${reviewId}" title="Reply" aria-label="Reply">${ICONS.reply}</button>` : ''}
            ${isOwner ? `<button type="button" class="edit-btn" data-id="${c.id}" title="Edit" aria-label="Edit">${ICONS.edit}</button>` : ''}
            ${isOwner || iAmSiteOwner ? `<button type="button" class="delete-comment-btn" data-id="${c.id}" data-mine="${isOwner ? '1' : ''}" title="Delete" aria-label="Delete">${ICONS.delete}</button>` : ''}
          </div>
          <div class="reply-form-container"></div>
          ${replies.length ? `
            <button type="button" class="thread-toggle" data-id="${c.id}" aria-expanded="${expanded}">${repliesLabel}</button>
            <div class="replies" ${expanded ? '' : 'hidden'}>
              ${replies.map(r => renderComment(r, allComments, reviewId, depth + 1)).join('')}
            </div>` : ''}
        </div>
      </div>
    `;
  }

  let animatePoll = null; // poll whose result bars should grow in after someone's first vote

  function renderPoll(poll){
    const total = poll.options.reduce((n, o) => n + o.count, 0);
    const myVote = session ? poll.myOptionId : null;
    const ended = pollHasEnded(poll);
    const canVote = !!(session && profile) && !poll.closed && !ended;
    const showResults = !!myVote || !canVote;
    const grow = animatePoll === poll.id;
    const options = poll.options.map(o => {
      if(!showResults){
        return `<button type="button" class="poll-opt" data-poll="${poll.id}" data-opt="${o.id}"><span class="poll-label">${escapeHtml(o.label)}</span></button>`;
      }
      const pct = total ? Math.round(o.count / total * 100) : 0;
      const mine = o.id === myVote;
      return `<button type="button" class="poll-opt result ${mine ? 'mine' : ''}" data-poll="${poll.id}" data-opt="${o.id}" aria-pressed="${mine}" ${canVote ? '' : 'disabled'}>
          <span class="poll-fill" style="width:${grow ? 0 : pct}%" data-pct="${pct}"></span>
          <span class="poll-label">${escapeHtml(o.label)}${mine ? '<span class="poll-check" aria-label="Your vote"> \u2713</span>' : ''}</span>
          <span class="poll-pct">${pct}%</span>
        </button>`;
    }).join('');
    const votes = `${total} ${total === 1 ? 'vote' : 'votes'}`;
    let note;
    const deadline = poll.ends_at ? ` Voting ends ${formatPollDate(poll.ends_at, true)}.` : '';
    if(poll.closed) note = `${votes}. This poll is closed.`;
    else if(ended) note = `${votes}. Polling ended ${formatPollDate(poll.ends_at, false)}.`;
    else if(!session) note = `${votes}.${deadline} <button type="button" class="poll-login">Log in to vote</button>`;
    else if(myVote) note = `${votes}. Tap another option to change your vote.${deadline}`;
    else note = `${votes}. Tap an option to vote.${deadline}`;
    return `
      <div class="poll" data-poll-id="${poll.id}">
        <div class="poll-q">${escapeHtml(poll.question)}</div>
        <div class="poll-opts">${options}</div>
        <div class="poll-note">${note}</div>
      </div>`;
  }

  function findCommentById(id){
    for(const r of ALL_REVIEWS){
      const found = r.comments.find(c => c.id === id);
      if(found) return found;
    }
    return null;
  }

  function autoGrow(textarea){
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight + 2, 220) + 'px';
  }

  function toggleEditForm(commentId, currentBody, wrapper, focus = true){
    const bubble = wrapper.querySelector('.bubble');
    const existing = bubble.nextElementSibling;
    if(existing && existing.classList.contains('edit-form')){
      existing.remove();
      bubble.hidden = false;
      return;
    }
    const form = document.createElement('form');
    form.className = 'edit-form';
    form.innerHTML = `
      <textarea maxlength="500" aria-label="Edit your comment"></textarea>
      <div class="edit-row"><button type="submit">Save</button><button type="button" class="cancel">Cancel</button></div>`;
    const textarea = form.querySelector('textarea');
    textarea.value = currentBody || '';
    const close = () => { form.remove(); bubble.hidden = false; };
    form.querySelector('.cancel').addEventListener('click', close);
    textarea.addEventListener('input', () => autoGrow(textarea));
    textarea.addEventListener('keydown', (e) => { if(e.key === 'Escape') close(); });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newBody = textarea.value.trim();
      if(!newBody) return;
      const { error } = await sb.from('comments').update({ body: newBody }).eq('id', commentId);
      if(error){ showToast("Couldn't save your edit: " + error.message, true); return; }
      close();
      showToast('Comment updated');
      loadAll();
    });
    bubble.hidden = true;
    bubble.after(form);
    autoGrow(textarea);
    if(focus) textarea.focus();
  }

  // ---------- GIF search ----------
  const gifCache = new Map(); // remembers results so repeat searches don't use up the hourly limit
  function escapeAttr(str){ return escapeHtml(str).replace(/"/g, '&quot;'); }
  function klipyCustomerId(){
    try {
      let id = localStorage.getItem('klipy-cid');
      if(!id){ id = crypto.randomUUID(); localStorage.setItem('klipy-cid', id); }
      return id;
    } catch(e) { return 'anonymous'; }
  }
  // KLIPY offers each GIF in several sizes; use a small one for the picker and a medium one for the comment
  function gifUrls(item){
    const files = item.file || item.files || {};
    const at = (path) => {
      const v = path.split('.').reduce((o, k) => (o == null ? o : o[k]), files);
      return typeof v === 'string' ? v : (v && typeof v.url === 'string' ? v.url : null);
    };
    const first = (paths) => { for(const path of paths){ const u = at(path); if(u) return u; } return null; };
    return {
      preview: first(['sm.gif', 'xs.gif', 'md.gif', 'gif', 'sm.webp', 'md.webp', 'hd.gif']),
      full: first(['md.gif', 'hd.gif', 'gif', 'sm.gif', 'md.webp', 'hd.webp'])
    };
  }
  async function fetchGifs(query){
    const key = query.trim().toLowerCase();
    if(gifCache.has(key)) return gifCache.get(key);
    const params = new URLSearchParams({ page: '1', per_page: '24', customer_id: klipyCustomerId(), rating: GIF_RATING });
    if(key) params.set('q', key);
    const res = await fetch(`https://api.klipy.com/api/v1/${encodeURIComponent(KLIPY_API_KEY)}/gifs/${key ? 'search' : 'trending'}?${params}`);
    if(res.status === 429) throw new Error('busy');
    if(!res.ok) throw new Error('failed');
    const json = await res.json();
    const gifs = (json?.data?.data || [])
      .filter(item => item && item.type !== 'ad')
      .map(item => ({ title: item.title || 'GIF', ...gifUrls(item) }))
      .filter(g => g.preview && g.full);
    gifCache.set(key, gifs);
    return gifs;
  }

  // ---------- Full emoji picker (loaded the first time someone opens it) ----------
  const EMOJI_PICKER_SRC = 'https://cdn.jsdelivr.net/npm/emoji-picker-element@1.29.1/index.js';
  let emojiPickerPromise = null;
  let emojiInsert = null; // inserts into whichever comment box opened the picker
  function getEmojiPicker(){
    if(!emojiPickerPromise){
      emojiPickerPromise = new Promise((resolve, reject) => {
        const giveUp = setTimeout(() => { emojiPickerPromise = null; reject(new Error('timeout')); }, 10000);
        if(!customElements.get('emoji-picker')){
          const script = document.createElement('script');
          script.type = 'module';
          script.src = EMOJI_PICKER_SRC;
          script.onerror = () => { clearTimeout(giveUp); emojiPickerPromise = null; script.remove(); reject(new Error('load')); };
          document.head.appendChild(script);
        }
        customElements.whenDefined('emoji-picker').then(() => {
          clearTimeout(giveUp);
          const el = document.createElement('emoji-picker');
          el.addEventListener('emoji-click', (e) => { if(emojiInsert) emojiInsert(e.detail.unicode); });
          resolve(el);
        });
      });
    }
    return emojiPickerPromise;
  }
  function syncEmojiTheme(el){
    const root = document.documentElement;
    const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && darkQuery.matches);
    el.classList.toggle('dark', dark);
    el.classList.toggle('light', !dark);
  }

  // Open a pop-up above the comment box if it fits, otherwise below, then make sure all of it is on screen
  function placePopup(pop){
    pop.classList.remove('below');
    const box = pop.parentElement.getBoundingClientRect();
    const navBottom = Math.max(0, document.querySelector('nav').getBoundingClientRect().bottom);
    const needed = pop.offsetHeight + 8;
    const above = box.top - navBottom;
    const below = window.innerHeight - box.bottom;
    if(above < needed && below > above) pop.classList.add('below');
    const r = pop.getBoundingClientRect();
    if(r.bottom > window.innerHeight - 8) window.scrollBy({ top: r.bottom - window.innerHeight + 8, behavior: 'smooth' });
    else if(r.top < navBottom + 8) window.scrollBy({ top: r.top - navBottom - 8, behavior: 'smooth' });
  }

  // Shared markup for the main comment box and reply boxes
  function composerHTML(placeholder, submitLabel){
    return `
      <div class="comment-input-wrap ${GIFS_ENABLED ? 'has-gif' : ''}">
        <textarea rows="1" placeholder="${placeholder}" maxlength="500" aria-label="${placeholder}"></textarea>
        <div class="comment-toolbar">
          <button type="button" class="emoji-toggle" title="Add emoji" aria-label="Add emoji">${ICONS.smile}</button>
          ${GIFS_ENABLED ? `<button type="button" class="gif-toggle" title="Add GIF" aria-label="Add GIF" aria-expanded="false">${ICONS.gif}</button>` : ''}
          <button type="button" class="camera-toggle" title="Add photo" aria-label="Add photo">${ICONS.camera}</button>
        </div>
        <div class="emoji-popup" role="dialog" aria-label="Choose an emoji"></div>
        ${GIFS_ENABLED ? `
        <div class="gif-popup" role="dialog" aria-label="Choose a GIF">
          <input type="search" class="gif-search" placeholder="Search GIFs" aria-label="Search GIFs" enterkeyhint="search">
          <div class="gif-grid" aria-live="polite"></div>
          <div class="gif-attrib">Powered by KLIPY</div>
        </div>` : ''}
        <input class="comment-file" type="file" accept="image/*,.gif" hidden>
      </div>
      <div class="file-indicator"></div>
      <button type="submit" class="post-btn" disabled>${submitLabel}</button>`;
  }

  // Shared behavior: emoji picker, photo attach, auto-grow, upload, then save(body, image_url)
  function wireComposer(form, submitLabel, save, afterSuccess){
    const textarea = form.querySelector('textarea');
    const popup = form.querySelector('.emoji-popup');
    const fileInput = form.querySelector('.comment-file');
    const indicator = form.querySelector('.file-indicator');
    const submitBtn = form.querySelector('.post-btn');
    const gifPopup = form.querySelector('.gif-popup');
    const gifToggle = form.querySelector('.gif-toggle');
    let gifUrl = null;
    const refresh = () => { submitBtn.disabled = !textarea.value.trim() && !fileInput.files[0] && !gifUrl; };
    const clearAttachment = () => { fileInput.value = ''; gifUrl = null; indicator.innerHTML = ''; refresh(); };
    const setGif = (url) => {
      fileInput.value = '';
      gifUrl = url || null;
      indicator.innerHTML = gifUrl ? `<img class="gif-thumb" src="${escapeAttr(gifUrl)}" alt="">GIF added<button type="button" class="remove-file">Remove</button>` : '';
      if(gifUrl) indicator.querySelector('.remove-file').addEventListener('click', clearAttachment);
      refresh();
    };
    const closeGifs = () => { if(gifPopup){ gifPopup.classList.remove('open'); gifToggle.setAttribute('aria-expanded', 'false'); } };
    form._getGif = () => gifUrl;   // used to keep a chosen GIF through live refreshes
    form._setGif = setGif;

    textarea.addEventListener('input', () => { autoGrow(textarea); refresh(); });
    const insertEmoji = (emoji) => {
      const start = textarea.selectionStart ?? textarea.value.length;
      const end = textarea.selectionEnd ?? textarea.value.length;
      textarea.setRangeText(emoji, start, end, 'end'); // goes where the cursor was, and the picker stays open for more
      autoGrow(textarea);
      refresh();
    };
    form.querySelector('.emoji-toggle').addEventListener('click', async () => {
      closeGifs();
      if(popup.classList.contains('open')){ popup.classList.remove('open'); return; }
      document.querySelectorAll('.emoji-popup.open').forEach(p => p.classList.remove('open'));
      popup.classList.add('open');
      placePopup(popup);
      emojiInsert = insertEmoji;
      if(!popup.querySelector('emoji-picker')) popup.innerHTML = '<p class="gif-msg">Loading emojis…</p>';
      try {
        const picker = await getEmojiPicker();
        syncEmojiTheme(picker);
        if(popup.classList.contains('open')){ popup.replaceChildren(picker); placePopup(popup); }
      } catch(err) {
        popup.innerHTML = '<p class="gif-msg">Emojis couldn\'t load. Check your connection and try again.</p>';
      }
    });

    if(gifPopup){
      const search = gifPopup.querySelector('.gif-search');
      const grid = gifPopup.querySelector('.gif-grid');
      let requestNo = 0, typingTimer = null;
      const loadGifs = async (query) => {
        const req = ++requestNo;
        grid.innerHTML = '<p class="gif-msg">Loading GIFs…</p>';
        try {
          const gifs = await fetchGifs(query);
          if(req !== requestNo) return; // a newer search replaced this one
          if(!gifs.length){
            grid.innerHTML = query.trim()
              ? `<p class="gif-msg">No GIFs found for "${escapeHtml(query.trim())}". Try another word.</p>`
              : '<p class="gif-msg">No trending GIFs right now. Try searching for one.</p>';
            return;
          }
          grid.innerHTML = gifs.map(g =>
            `<button type="button" class="gif-item" data-full="${escapeAttr(g.full)}" aria-label="${escapeAttr(g.title)}"><img src="${escapeAttr(g.preview)}" alt="" loading="lazy"></button>`
          ).join('');
          grid.querySelectorAll('.gif-item').forEach(btn => {
            btn.addEventListener('click', () => { setGif(btn.dataset.full); closeGifs(); textarea.focus(); });
          });
        } catch(err) {
          if(req !== requestNo) return;
          grid.innerHTML = `<p class="gif-msg">${err.message === 'busy'
            ? 'GIF search is busy right now. Try again in a few minutes.'
            : "GIFs couldn't load. Check your connection and try again."}</p>`;
        }
      };
      gifToggle.addEventListener('click', () => {
        popup.classList.remove('open');
        const opening = !gifPopup.classList.contains('open');
        gifPopup.classList.toggle('open', opening);
        if(opening) placePopup(gifPopup);
        gifToggle.setAttribute('aria-expanded', opening);
        if(opening){
          if(!grid.children.length) loadGifs(search.value);
          search.focus({ preventScroll: true });
        }
      });
      search.addEventListener('input', () => {
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => loadGifs(search.value), 450); // wait until they pause typing
      });
      search.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){ e.preventDefault(); clearTimeout(typingTimer); loadGifs(search.value); }
      });
    }
    form.querySelector('.camera-toggle').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if(file) gifUrl = null; // one picture per comment: a photo replaces a chosen GIF
      indicator.innerHTML = file ? `📎 ${escapeHtml(file.name)}<button type="button" class="remove-file">Remove</button>` : '';
      if(file){
        indicator.querySelector('.remove-file').addEventListener('click', () => {
          fileInput.value = '';
          indicator.innerHTML = '';
          refresh();
        });
      }
      refresh();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = textarea.value.trim();
      const imageFile = fileInput.files[0];
      if(!body && !imageFile && !gifUrl) return;
      form.dataset.busy = '1'; // live refreshes leave this form's text alone while it's sending
      submitBtn.disabled = true;
      submitBtn.textContent = imageFile ? 'Uploading…' : 'Posting…';
      let image_url = gifUrl; // a GIF from search is already online, so there's nothing to upload
      if(imageFile){
        const path = crypto.randomUUID() + '-' + imageFile.name.replace(/[^a-zA-Z0-9.]/g, '_');
        const { error: uploadError } = await sb.storage.from('comment-images').upload(path, imageFile);
        if(uploadError){
          showToast("Couldn't upload the image: " + uploadError.message, true);
          delete form.dataset.busy;
          submitBtn.textContent = submitLabel;
          refresh();
          return;
        }
        image_url = sb.storage.from('comment-images').getPublicUrl(path).data.publicUrl;
      }
      const ok = await save(body, image_url);
      delete form.dataset.busy;
      if(!ok){ submitBtn.textContent = submitLabel; refresh(); return; }
      textarea.value = '';
      fileInput.value = '';
      gifUrl = null;
      indicator.innerHTML = '';
      autoGrow(textarea);
      submitBtn.textContent = submitLabel;
      refresh();
      if(afterSuccess) afterSuccess();
      loadAll();
    });
  }

  function toggleReplyForm(parentId, reviewId, container, focus = true){
    const existing = container.querySelector('.reply-form');
    if(existing){ existing.remove(); return; }
    const form = document.createElement('form');
    form.className = 'reply-form';
    form.innerHTML = composerHTML('Write a reply…', 'Reply');
    wireComposer(form, 'Reply', async (body, image_url) => {
      const { error } = await sb.from('comments').insert({
        review_id: reviewId, author: profile.display_name, user_id: session.user.id,
        body, parent_comment_id: parentId, image_url
      });
      if(error){ showToast("Couldn't post your reply: " + error.message, true); return false; }
      expandedThreads.add(parentId);
      showToast('Reply posted');
      return true;
    }, () => form.remove());
    container.appendChild(form);
    if(focus) form.querySelector('textarea').focus();
  }

  // Returns true if a like/dislike was added, false if removed or failed
  async function castVote(id, type){
    const current = getVote(id);
    if(current && current.type === type){
      await sb.from('likes').delete().eq('id', current.rowId);
      setVote(id, null);
      return false;
    }
    if(current) await sb.from('likes').delete().eq('id', current.rowId);
    const { data, error } = await sb.from('likes').insert({ review_id: id, type }).select().single();
    if(error){ showToast("Couldn't save your vote: " + error.message, true); return false; }
    setVote(id, { type, rowId: data.id });
    return true;
  }

  async function likeFromDoubleTap(cover){
    const id = cover.dataset.id;
    const burst = cover.querySelector('.burst');
    burst.classList.remove('go');
    void burst.offsetWidth; // restart the animation if tapped again quickly
    burst.classList.add('go');
    if(getVote(id)?.type === 'like') return; // already liked: just show the heart, like Instagram
    const letAnimationFinish = new Promise(res => setTimeout(res, 800));
    await Promise.all([castVote(id, 'like'), letAnimationFinish]);
    loadAll();
  }

  // ---------- Keep what the visitor is doing intact across live refreshes ----------
  function captureUIState(container){
    const state = { drafts:{}, replies:{}, edits:{}, focus:null, anchor:null };
    container.querySelectorAll('.comment-form:not([data-busy])').forEach(f => {
      const text = f.querySelector('textarea').value;
      const file = f.querySelector('.comment-file').files[0];
      const gif = f._getGif ? f._getGif() : null;
      if(text || file || gif) state.drafts[f.dataset.id] = { text, file, gif };
    });
    container.querySelectorAll('.reply-form:not([data-busy])').forEach(f => {
      state.replies[f.closest('.comment').dataset.id] = {
        text: f.querySelector('textarea').value, file: f.querySelector('.comment-file').files[0],
        gif: f._getGif ? f._getGif() : null
      };
    });
    container.querySelectorAll('.edit-form').forEach(f => {
      state.edits[f.closest('.comment').dataset.id] = { text: f.querySelector('textarea').value };
    });
    const active = document.activeElement;
    if(active && active.tagName === 'TEXTAREA' && container.contains(active)){
      const form = active.closest('form');
      const kind = form.classList.contains('comment-form') ? 'drafts' : form.classList.contains('reply-form') ? 'replies' : 'edits';
      const key = kind === 'drafts' ? form.dataset.id : form.closest('.comment').dataset.id;
      state.focus = { kind, key, start: active.selectionStart, end: active.selectionEnd };
    }
    // Remember the first thing visible on screen so new content above it doesn't shove the page around
    for(const el of container.querySelectorAll('.entry, .comment')){
      const r = el.getBoundingClientRect();
      if(r.height > 0 && r.bottom > 0){
        state.anchor = { selector: `.${el.classList.contains('entry') ? 'entry' : 'comment'}[data-id="${el.dataset.id}"]`, top: r.top };
        if(r.top >= 0) break;
      }
    }
    return state;
  }

  function restoreUIState(container, state){
    const textareas = { drafts:{}, replies:{}, edits:{} };
    const fill = (form, saved) => {
      const ta = form.querySelector('textarea');
      ta.value = saved.text;
      ta.dispatchEvent(new Event('input'));
      const fileInput = form.querySelector('.comment-file');
      if(fileInput && saved.file){
        try {
          const dt = new DataTransfer();
          dt.items.add(saved.file);
          fileInput.files = dt.files;
          fileInput.dispatchEvent(new Event('change'));
        } catch(e) {}
      }
      if(saved.gif && form._setGif) form._setGif(saved.gif);
      return ta;
    };
    for(const [id, saved] of Object.entries(state.drafts)){
      const f = container.querySelector(`.comment-form[data-id="${id}"]`);
      if(f) textareas.drafts[id] = fill(f, saved);
    }
    for(const [parentId, saved] of Object.entries(state.replies)){
      const c = container.querySelector(`.comment[data-id="${parentId}"]`);
      const replyBtn = c && c.querySelector('.reply-btn');
      if(!replyBtn) continue;
      toggleReplyForm(parentId, replyBtn.dataset.review, c.querySelector('.reply-form-container'), false);
      textareas.replies[parentId] = fill(c.querySelector('.reply-form'), saved);
    }
    for(const [id, saved] of Object.entries(state.edits)){
      const c = container.querySelector(`.comment[data-id="${id}"]`);
      const found = findCommentById(id);
      if(!c || !found) continue;
      toggleEditForm(id, found.body, c, false);
      textareas.edits[id] = fill(c.querySelector('.edit-form'), saved);
    }
    if(state.anchor && !goingHome){
      const el = container.querySelector(state.anchor.selector);
      if(el){
        const shift = el.getBoundingClientRect().top - state.anchor.top;
        if(Math.abs(shift) > 1) window.scrollBy(0, shift);
      }
    }
    if(state.focus){
      const ta = textareas[state.focus.kind][state.focus.key];
      if(ta){
        ta.focus({ preventScroll: true });
        try { ta.setSelectionRange(state.focus.start, state.focus.end); } catch(e) {}
      }
    }
  }

  let goingHome = false; // true while the JSR logo scrolls to the top, so refreshes don't hold the old scroll spot
  let knownCommentIds = null; // comments already seen, so brand-new ones can get a brief highlight

  function render(filter){
    const list = filter === 'all' ? ALL_REVIEWS : ALL_REVIEWS.filter(r => r.category === filter);
    const container = document.getElementById('entries');
    const uiState = captureUIState(container);
    if(list.length === 0){
      container.innerHTML = "<div class='empty-state'>No entries in this category yet.</div>";

    container.innerHTML = list.map(r => {
      const vote = getVote(r.id)?.type;
      return `
      <article class="entry" data-id="${r.id}" data-cat="${r.category}">
        <div class="entry-meta">
          <span class="tag ${r.category}">${CATS[r.category]}</span>
          <span>${formatDate(r.created_at)}</span>
        </div>
        <div class="entry-head ${r.image_url ? 'has-cover' : ''}">
          <div class="entry-titles">
            ${r.title ? `<h2>${r.title}</h2>` : ''}
            ${r.subject ? `<div class="subject">${r.subject}</div>` : ''}
            ${r.rating != null ? `<div class="stars">${stars(r.rating)}</div>` : ''}
          </div>
          ${r.image_url ? `
          <div class="cover" data-id="${r.id}" tabindex="0" role="button" title="Click to enlarge, double-click to like" aria-label="Enlarge cover image for ${escapeHtml(r.title || r.poll?.question || 'this post')}">
            <img src="${r.image_url}" alt="${escapeHtml(r.title || r.poll?.question || '')}">
            <div class="burst" aria-hidden="true">❤️</div>
          </div>` : ''}
          ${r.body ? `<div class="body rich">${bodyToHTML(r.body)}</div>` : ''}
        </div>
        ${r.poll ? renderPoll(r.poll) : ''}
        <div class="actions">
          <button class="like-btn vote-btn ${vote === 'like' ? 'liked' : ''} ${popTarget === `r-${r.id}-like` ? 'pop' : ''}" data-id="${r.id}" data-type="like" aria-pressed="${vote === 'like'}" title="Like"><span class="heart">❤️</span> ${r.likeCount}</button>
          <button class="like-btn vote-btn ${vote === 'dislike' ? 'liked' : ''} ${popTarget === `r-${r.id}-dislike` ? 'pop' : ''}" data-id="${r.id}" data-type="dislike" aria-pressed="${vote === 'dislike'}" title="Dislike"><span class="heart">👎</span> ${r.dislikeCount}</button>
        </div>
        <div class="comments">
          ${r.comments.filter(c => !c.parent_comment_id).map(c => renderComment(c, r.comments, r.id, 0)).join('')}
          ${session && profile
            ? `<form class="comment-form" data-id="${r.id}">${composerHTML('Add a comment…', 'Post')}</form>`
            : `<p class="login-hint">Log in above to add a comment.</p>`}
        </div>
      </article>`;
    }).join('');
    popTarget = null;

    container.querySelectorAll('.vote-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const added = await castVote(btn.dataset.id, btn.dataset.type);
        if(added) popTarget = `r-${btn.dataset.id}-${btn.dataset.type}`;
        loadAll();
      });
    });

    container.querySelectorAll('.cover').forEach(cover => {
      let clickTimer = null;
      cover.addEventListener('click', () => {
        if(clickTimer){
          clearTimeout(clickTimer);
          clickTimer = null;
          likeFromDoubleTap(cover);
        } else {
          clickTimer = setTimeout(() => {
            clickTimer = null;
            openLightbox(cover.querySelector('img').src);
          }, 260);
        }
      });
      cover.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLightbox(cover.querySelector('img').src); }
      });
    });

    if(animatePoll){
      const id = animatePoll;
      animatePoll = null;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        container.querySelectorAll(`.poll[data-poll-id="${id}"] .poll-fill`).forEach(f => { f.style.width = f.dataset.pct + '%'; });
      }));
    }
    container.querySelectorAll('.poll-login').forEach(b => b.addEventListener('click', () => openAuthDialog('login')));
    container.querySelectorAll('.poll-opt:not([disabled])').forEach(btn => {
      btn.addEventListener('click', async () => {
        const pollId = btn.dataset.poll, optId = btn.dataset.opt;
        const poll = ALL_REVIEWS.find(r => r.poll && r.poll.id === pollId)?.poll;
        if(!poll || poll.closed || !session) return;
        if(pollHasEnded(poll)){ showToast('Voting has ended for this poll.'); render(currentFilter); return; }
        const current = poll.myOptionId;
        if(current === optId) return;
        container.querySelectorAll(`.poll[data-poll-id="${pollId}"] .poll-opt`).forEach(b => { b.disabled = true; });
        const { error } = current
          ? await sb.from('poll_votes').update({ option_id: optId }).eq('poll_id', pollId).eq('user_id', session.user.id)
          : await sb.from('poll_votes').insert({ poll_id: pollId, option_id: optId, user_id: session.user.id });
        if(error){
          // the database checks the deadline too, so a vote cast in the final seconds can land just after it
          const lateVote = poll.ends_at && new Date(poll.ends_at).getTime() <= Date.now() + 60000;
          showToast(lateVote ? 'Voting has ended for this poll.' : "Couldn't save your vote: " + error.message, !lateVote);
          loadAll();
          return;
        }
        if(!current) animatePoll = pollId;
        loadAll();
      });
    });

    container.querySelectorAll('.comment-like-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const found = findCommentById(id);
        if(!found) return;
        const liking = !found.likerIds.includes(session.user.id);
        const { error } = liking
          ? await sb.from('comment_likes').insert({ comment_id: id, user_id: session.user.id })
          : await sb.from('comment_likes').delete().eq('comment_id', id).eq('user_id', session.user.id);
        if(error){ showToast("Couldn't update your like: " + error.message, true); return; }
        if(liking) popTarget = 'c-' + id;
        loadAll();
      });
    });

    container.querySelectorAll('.thread-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = btn.nextElementSibling;
        const opening = box.hidden;
        box.hidden = !opening;
        if(opening) expandedThreads.add(btn.dataset.id); else expandedThreads.delete(btn.dataset.id);
        const n = box.children.length;
        btn.textContent = opening ? 'Hide replies' : `View ${n} ${n === 1 ? 'reply' : 'replies'}`;
        btn.setAttribute('aria-expanded', opening);
      });
    });

    container.querySelectorAll('.reply-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const wrapper = btn.closest('.comment').querySelector('.reply-form-container');
        toggleReplyForm(btn.dataset.id, btn.dataset.review, wrapper);
      });
    });

    container.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const found = findCommentById(btn.dataset.id);
        if(found) toggleEditForm(btn.dataset.id, found.body, btn.closest('.comment'));
      });
    });

    container.querySelectorAll('.delete-comment-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const prompt = btn.dataset.mine
          ? 'Delete your comment? Any replies to it will be deleted too.'
          : "Delete this visitor's comment? Any replies to it will be deleted too.";
        if(!confirm(prompt)) return;
        const { error } = await sb.from('comments').delete().eq('id', btn.dataset.id);
        if(error){ showToast("Couldn't delete your comment: " + error.message, true); return; }
        showToast('Comment deleted');
        loadAll();
      });
    });

    container.querySelectorAll('.comment-form').forEach(form => {
      wireComposer(form, 'Post', async (body, image_url) => {
        const { error } = await sb.from('comments').insert({
          review_id: form.dataset.id, author: profile.display_name, user_id: session.user.id, body, image_url
        });
        if(error){ showToast("Couldn't post your comment: " + error.message, true); return false; }
        showToast('Comment posted');
        return true;
      });
    });

    container.querySelectorAll('.comment-img').forEach(img => {
      img.addEventListener('click', () => openLightbox(img.src));
    });

    const allIds = ALL_REVIEWS.flatMap(r => r.comments.map(c => c.id));
    if(knownCommentIds){
      allIds.filter(id => !knownCommentIds.has(id)).forEach(id => {
        const bubble = container.querySelector(`.comment[data-id="${id}"] .bubble`);
        if(bubble) bubble.classList.add('fresh');
      });
    }
    knownCommentIds = new Set(allIds);

    restoreUIState(container, uiState);
  }

  function openLightbox(src){
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }

  // ---------- Formatted review text ----------
  // Only the formatting the admin toolbar can make is kept; anything else (scripts, links, images, odd styles) is dropped.
  const RICH_TAGS = new Set(['P', 'BR', 'DIV', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'STRIKE', 'UL', 'OL', 'LI', 'SPAN', 'FONT']);
  const RICH_SIZES = new Set(['0.85em', '1.25em', '1.6em']);
  const DROP_WITH_CONTENTS = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'TEMPLATE', 'NOSCRIPT', 'SVG', 'MATH', 'TEXTAREA', 'SELECT', 'BUTTON']);
  function sanitizeRichText(html){
    const tpl = document.createElement('template'); // parsed without running anything or loading anything
    tpl.innerHTML = html;
    const clean = (parent) => {
      [...parent.childNodes].forEach(node => {
        if(node.nodeType === Node.TEXT_NODE) return;
        if(node.nodeType !== Node.ELEMENT_NODE){ node.remove(); return; }
        const tag = node.tagName.toUpperCase();
        if(DROP_WITH_CONTENTS.has(tag)){ node.remove(); return; }
        clean(node);
        if(!RICH_TAGS.has(tag)){ node.replaceWith(...node.childNodes); return; } // keep the words, drop the tag
        let color = null, size = null;
        if(tag === 'SPAN' || tag === 'FONT'){
          const style = node.getAttribute('style') || '';
          const c = /(?:^|;)\s*color\s*:\s*(#[0-9a-f]{3,8}|rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\))/i.exec(style)
                 || (tag === 'FONT' && /^(#[0-9a-f]{3,8})$/i.exec(node.getAttribute('color') || ''));
          const z = /(?:^|;)\s*font-size\s*:\s*([\d.]+em)/i.exec(style);
          if(c) color = c[1];
          if(z && RICH_SIZES.has(z[1])) size = z[1];
        }
        if(tag === 'FONT' || tag === 'SPAN'){
          if(!color && !size){ node.replaceWith(...node.childNodes); return; } // a span with no formatting adds nothing
          const span = document.createElement('span');
          if(color) span.style.color = color;
          if(size) span.style.fontSize = size;
          span.append(...node.childNodes);
          node.replaceWith(span);
          return;
        }
        [...node.attributes].forEach(a => node.removeAttribute(a.name));
      });
    };
    clean(tpl.content);
    tpl.content.querySelectorAll('p:empty, div:empty').forEach(el => el.remove());
    return tpl.innerHTML;
  }
  // Older reviews were saved as plain text; show each line on its own, with blank lines kept
  function bodyToHTML(body){
    if(!body) return '';
    if(/<\/?(p|br|div|ul|ol|li|strong|em|b|i|u|s|span)\b/i.test(body)) return sanitizeRichText(body);
    return body.split('\n').map(line => `<p>${escapeHtml(line) || '<br>'}</p>`).join('');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // The JSR logo works like a home button: back to the top, back to "All", fresh posts
  function goHome(e){
    if(e) e.preventDefault();
    goingHome = true;
    if(currentFilter !== 'all'){ currentFilter = 'all'; renderFilters(); render(currentFilter); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    loadAll().finally(() => setTimeout(() => { goingHome = false; }, 1000));
  }
  document.getElementById('site-logo').addEventListener('click', goHome);

  // Phones and tablets: a JSR button follows you down the page once you've scrolled a bit
  const homeFab = document.getElementById('home-fab');
  homeFab.addEventListener('click', goHome);
  let fabShown = false;
  function updateFab(){
    const show = window.scrollY > 480;
    if(show === fabShown) return;
    fabShown = show;
    homeFab.classList.toggle('show', show);
    homeFab.setAttribute('aria-hidden', String(!show));
    homeFab.tabIndex = show ? 0 : -1;
  }
  window.addEventListener('scroll', updateFab, { passive: true });
  updateFab();

  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').classList.remove('open');
  });

  // ---------- Appearance (light / dark / follow the device) ----------
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  function currentThemeChoice(){
    try { return localStorage.getItem('theme') || 'system'; } catch(e) { return 'system'; }
  }
  function syncThemeColor(){
    const paper = getComputedStyle(document.documentElement).getPropertyValue('--desk').trim();
    document.querySelector('meta[name="theme-color"]').setAttribute('content', paper);
  }
  function applyTheme(choice){
    if(choice === 'light' || choice === 'dark') document.documentElement.dataset.theme = choice;
    else delete document.documentElement.dataset.theme;
    try {
      if(choice === 'system') localStorage.removeItem('theme');
      else localStorage.setItem('theme', choice);
    } catch(e) {}
    document.querySelectorAll('[data-theme-choice]').forEach(b => {
      b.setAttribute('aria-checked', b.dataset.themeChoice === choice);
    });
    syncThemeColor();
  }
  document.querySelectorAll('[data-theme-choice]').forEach(b => {
    b.addEventListener('click', () => applyTheme(b.dataset.themeChoice));
  });
  darkQuery.addEventListener('change', () => { if(currentThemeChoice() === 'system') syncThemeColor(); });
  applyTheme(currentThemeChoice());

  const settingsBtn = document.getElementById('settings-btn');
  const settingsPanel = document.getElementById('settings-panel');
  function setSettingsOpen(open){
    settingsPanel.hidden = !open;
    settingsBtn.setAttribute('aria-expanded', open);
  }
  settingsBtn.addEventListener('click', () => setSettingsOpen(settingsPanel.hidden));

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.settings')) setSettingsOpen(false);
    if(!e.target.closest('.gif-popup, .gif-toggle')){
      document.querySelectorAll('.gif-popup.open').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.gif-toggle').forEach(b => b.setAttribute('aria-expanded', 'false'));
    }
    if(e.target.closest('.emoji-popup, .emoji-toggle')) return;
    document.querySelectorAll('.emoji-popup.open').forEach(p => p.classList.remove('open'));
  });
  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    document.getElementById('lightbox').classList.remove('open');
    setSettingsOpen(false);
    document.querySelectorAll('.emoji-popup.open, .gif-popup.open').forEach(p => p.classList.remove('open'));
  });

  // ---------- Live updates ----------
  let refreshTimer = null;
  function scheduleRefresh(){
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(loadAll, 500); // bundles bursts of changes into one refresh
  }
  function startLiveUpdates(){
    const channel = sb.channel('site-activity');
    ['reviews', 'comments', 'likes', 'comment_likes', 'profiles', 'polls', 'poll_options', 'poll_votes'].forEach(table => {
      channel.on('postgres_changes', { event: '*', schema: 'public', table }, scheduleRefresh);
    });
    channel.subscribe();
  }
  // Catch up after a phone was locked or the tab sat in the background
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') scheduleRefresh();
  });
  // Keep "5m" / "2h" timestamps current without a full refresh
  setInterval(() => {
    document.querySelectorAll('.comment-actions time').forEach(t => { t.textContent = timeAgo(t.getAttribute('datetime')); });
  }, 60000);

  (async () => {
    await initAuth();
    scheduleAuthPrompt();
    await loadAll();
    document.getElementById('entries').removeAttribute('aria-busy');
    startLiveUpdates();
  })();
</script>
