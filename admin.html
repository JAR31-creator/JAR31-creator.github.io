<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Just Some Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  body{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;max-width:480px;margin:60px auto;padding:0 20px;color:#1C1B19;}
  h1{font-size:1.4rem;}
  input, select, textarea{width:100%;padding:8px;margin-bottom:12px;font-size:0.95rem;box-sizing:border-box;}
  input, select, textarea, button{font-family:inherit;}
  #body{font-family:'Nunito', system-ui, sans-serif;font-size:1.08rem;line-height:1.65;min-height:240px;padding:14px 16px;border:1px solid #D8D1C3;border-radius:10px;background:#FFFDF9;color:#1C1B19;resize:vertical;}
  #body:focus{outline:none;border-color:#8C857A;}
  #body::placeholder{color:#9A938A;}
  button{padding:8px 16px;cursor:pointer;}
  #status{margin-top:10px;font-size:0.9rem;}
  #app{display:none;}
  .manage-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:0.9rem;}
  .manage-row button{background:#b3452f;color:#fff;border:none;border-radius:4px;padding:4px 10px;font-size:0.8rem;}
  .manage-row .row-actions{display:flex;gap:6px;flex:none;}
  .manage-row button.poll-btn{background:#eee;color:#1C1B19;border:1px solid #ccc;}
  .poll-toggle{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:0.95rem;cursor:pointer;}
  .poll-toggle input{width:auto;margin:0;}
  #poll-fields{border:1px solid #D8D1C3;border-radius:10px;padding:14px 14px 2px;margin-bottom:16px;background:#FFFDF9;}
  .poll-opt-row{display:flex;gap:6px;align-items:flex-start;}
  .poll-opt-row input{flex:1;}
  .poll-opt-row button{margin-bottom:12px;padding:8px 11px;background:none;border:1px solid #ccc;border-radius:4px;}
  button.secondary{background:#eee;border:1px solid #ccc;border-radius:4px;margin-bottom:12px;}
  .date-group{margin-top:8px;}
  .date-group summary{font-weight:600;font-size:0.85rem;cursor:pointer;padding:6px 0;color:#333;list-style:none;user-select:none;}
  .date-group summary::-webkit-details-marker{display:none;}
  .date-group summary::before{content:'▶';display:inline-block;margin-right:6px;font-size:0.65rem;transition:transform 0.15s;}
  .date-group[open] summary::before{transform:rotate(90deg);}
  .date-group .count{color:#888;font-weight:400;font-size:0.78rem;}
</style>
</head>
<body>

<div id="login">
  <h1>Log in</h1>
  <form id="login-form">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" style="width:auto;flex:1;margin-bottom:0;">
      <label style="font-size:0.8rem;display:flex;align-items:center;gap:4px;white-space:nowrap;">
        <input type="checkbox" onchange="document.getElementById('password').type = this.checked ? 'text' : 'password';"> Show
      </label>
    </div>
    <div id="turnstile-container" style="margin-bottom:12px;"></div>
    <button type="submit">Log in</button>
    <div id="login-status"></div>
    <a href="#" onclick="forgotPassword(); return false;" style="font-size:0.85rem;display:inline-block;margin-top:10px;">Forgot password?</a>
  </form>
</div>

<div id="app">
  <button onclick="logout()" style="float:right;background:#eee;color:#1C1B19;border:1px solid #ccc;border-radius:4px;">Log out</button>
  <h1 id="form-heading">Add a review</h1>
  <select id="category" onchange="updateFormForCategory()">
    <optgroup label="Reviews">
      <option value="film">Film</option>
      <option value="tv">TV Show</option>
      <option value="game">Game</option>
      <option value="music">Music</option>
    </optgroup>
    <optgroup label="Other">
      <option value="announcement">Announcement</option>
      <option value="post">Post</option>
    </optgroup>
  </select>
  <input id="title" placeholder="Title (e.g. Past Lives)">
  <input id="subject" placeholder="Subject line (e.g. Directed by Celine Song, 2023)">
  <select id="rating">
    <option value="5">5 stars</option>
    <option value="4.5">4.5 stars</option>
    <option value="4">4 stars</option>
    <option value="3.5">3.5 stars</option>
    <option value="3">3 stars</option>
    <option value="2.5">2.5 stars</option>
    <option value="2">2 stars</option>
    <option value="1.5">1.5 stars</option>
    <option value="1">1 star</option>
  </select>
  <textarea id="body" placeholder="Your review"></textarea>
  <div id="poll-section" hidden>
    <label class="poll-toggle"><input type="checkbox" id="poll-enabled"> Add a poll</label>
    <div id="poll-fields" hidden>
      <input id="poll-question" maxlength="140" placeholder="Poll question (e.g. Which movie should I watch next?)">
      <div id="poll-options"></div>
      <button type="button" id="add-poll-option" class="secondary">+ Add option</button>
    </div>
  </div>
  <label style="font-size:0.85rem;display:block;margin-bottom:4px;">Cover image (optional)</label>
  <input id="image" type="file" accept="image/*">
  <button onclick="submitReview()">Publish</button>
  <div id="status"></div>

  <h1 style="margin-top:40px;">Manage reviews</h1>
  <div id="manage-list">Loading…</div>

  <h1 style="margin-top:40px;">Manage comments</h1>
  <div id="comments-list" style="max-height:340px;overflow-y:auto;">Loading…</div>
</div>

<script>
  const SUPABASE_URL = "https://lzktxoizovfjgkxkpbhw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6a3R4b2l6b3ZmamdreGtwYmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDA3MDYsImV4cCI6MjEwNTg3NjcwNn0.NUWMnrx3XGoaDjQQovP5R100CDQL4Bk4Bix7kr52fJY";
  const TURNSTILE_SITE_KEY = "0x4AAAAAAFDVvbmopL_cQoNQ";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storageKey: 'sb-admin-auth' }
  });

  let turnstileToken = null;
  let turnstileWidgetId = null;

  window.onload = function(){
    turnstileWidgetId = turnstile.render('#turnstile-container', {
      sitekey: TURNSTILE_SITE_KEY,
      callback: (token) => { turnstileToken = token; }
    });
  };

  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if(data.session){
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadManageList();
      loadCommentsList();
    }
  }

  async function logout(){
    await sb.auth.signOut();
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'block';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    document.getElementById('login-status').textContent = '';
  }

  async function loadManageList(){
    const list = document.getElementById('manage-list');
    const [{ data, error }, { data: polls }] = await Promise.all([
      sb.from('reviews').select('*').order('created_at', {ascending:false}),
      sb.from('polls').select('id, review_id, closed')
    ]);
    if(error){ list.textContent = 'Error loading reviews.'; return; }
    if(!data.length){ list.textContent = 'No reviews yet.'; return; }
    const pollFor = new Map((polls || []).map(p => [p.review_id, p]));
    list.innerHTML = data.map(r => {
      const poll = pollFor.get(r.id);
      return `
      <div class="manage-row">
        <span>${r.title} <em>(${r.category}${poll ? (poll.closed ? ', poll closed' : ', poll open') : ''})</em></span>
        <span class="row-actions">
          ${poll ? `<button class="poll-btn" data-poll="${poll.id}" data-closed="${poll.closed ? '1' : ''}">${poll.closed ? 'Reopen poll' : 'Close poll'}</button>` : ''}
          <button class="del-btn" data-id="${r.id}">Delete</button>
        </span>
      </div>`;
    }).join('');
    list.querySelectorAll('.poll-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const { error } = await sb.from('polls').update({ closed: !btn.dataset.closed }).eq('id', btn.dataset.poll);
        if(error){ alert("Couldn't update the poll: " + error.message); return; }
        loadManageList();
      });
    });
    list.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Delete "' + btn.closest('.manage-row').querySelector('span').textContent.trim() + '"? This also removes its comments, likes, and any poll.')) return;
        const { data, error } = await sb.from('reviews').delete().eq('id', btn.dataset.id).select();
        if(error){ alert('Delete failed: ' + error.message); return; }
        if(!data || data.length === 0){ alert('Nothing was deleted — this usually means your admin delete policy on the reviews table has the wrong User UID. Check Database → Policies → "admin write reviews".'); return; }
        loadManageList();
        loadCommentsList();
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  async function loadCommentsList(){
    const list = document.getElementById('comments-list');
    const { data, error } = await sb.from('comments')
      .select('id, author, body, image_url, created_at, reviews(title)')
      .order('created_at', {ascending:false});
    if(error){ list.textContent = 'Error loading comments.'; return; }
    if(!data.length){ list.textContent = 'No comments yet.'; return; }

    const groups = [];
    data.forEach(c => {
      const dateLabel = new Date(c.created_at).toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
      const last = groups[groups.length - 1];
      if(!last || last.label !== dateLabel){
        groups.push({ label: dateLabel, items: [c] });
      } else {
        last.items.push(c);
      }
    });

    list.innerHTML = groups.map((g, idx) => `
      <details class="date-group" ${idx === 0 ? 'open' : ''}>
        <summary>${g.label} <span class="count">(${g.items.length})</span></summary>
        ${g.items.map(c => `
          <div class="manage-row">
            <span>
              <em>${escapeHtml(c.reviews ? c.reviews.title : 'Unknown review')}</em> —
              <strong>${escapeHtml(c.author)}</strong>:
              ${escapeHtml(c.body) || '(image only)'}
              ${c.image_url ? ' 📷' : ''}
            </span>
            <button data-id="${c.id}">Delete</button>
          </div>
        `).join('')}
      </details>
    `).join('');

    list.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Delete this comment?')) return;
        const { data, error } = await sb.from('comments').delete().eq('id', btn.dataset.id).select();
        if(error){ alert('Delete failed: ' + error.message); return; }
        if(!data || data.length === 0){ alert('Nothing was deleted — this usually means your delete policy on the comments table has the wrong User UID. Check Database → Policies → "admin delete comments".'); return; }
        loadCommentsList();
      });
    });
  }

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    login();
  });

  async function forgotPassword(){
    const email = document.getElementById('email').value.trim();
    const status = document.getElementById('login-status');
    if(!email){ status.textContent = 'Enter your email above first, then click "Forgot password?" again.'; return; }
    if(!turnstileToken){ status.textContent = 'Please complete the verification check above first.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
      captchaToken: turnstileToken
    });
    if(turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId);
    turnstileToken = null;
    status.textContent = error ? error.message : 'Check your email for a password reset link.';
  }

  async function login(){
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({
      email, password,
      options: { captchaToken: turnstileToken }
    });
    if(turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId);
    turnstileToken = null;
    if(error){
      document.getElementById('login-status').textContent = error.message;
    } else {
      checkSession();
    }
  }

  const NON_REVIEW = ['announcement', 'post'];
  const FORM_COPY = {
    review:       { heading: 'Add a review',        title: 'Title (e.g. Past Lives)',               subject: 'Subject line (e.g. Directed by Celine Song, 2023)', body: 'Your review' },
    announcement: { heading: 'Add an announcement', title: 'Title (e.g. October giveaway!)',        subject: 'Optional detail (e.g. Ends October 31)',           body: 'Your announcement' },
    post:         { heading: 'Add a post',          title: 'Title (e.g. What should I review next?)', subject: 'Optional subtitle',                               body: 'What\'s on your mind?' }
  };

  function updateFormForCategory(){
    const category = document.getElementById('category').value;
    const key = NON_REVIEW.includes(category) ? category : 'review';
    const copy = FORM_COPY[key];
    document.getElementById('form-heading').textContent = copy.heading;
    document.getElementById('title').placeholder = copy.title;
    document.getElementById('subject').placeholder = copy.subject;
    document.getElementById('body').placeholder = copy.body;
    document.getElementById('rating').hidden = key !== 'review';
    document.getElementById('poll-section').hidden = key === 'review';
  }

  // ---------- Poll builder ----------
  const MAX_POLL_OPTIONS = 6;
  function addPollOption(value = ''){
    const wrap = document.getElementById('poll-options');
    if(wrap.children.length >= MAX_POLL_OPTIONS) return;
    const row = document.createElement('div');
    row.className = 'poll-opt-row';
    row.innerHTML = '<input class="poll-option" maxlength="80"><button type="button" aria-label="Remove this option">&#10005;</button>';
    row.querySelector('input').value = value;
    row.querySelector('button').addEventListener('click', () => { row.remove(); refreshPollOptions(); });
    wrap.appendChild(row);
    refreshPollOptions();
  }
  function refreshPollOptions(){
    const rows = [...document.querySelectorAll('#poll-options .poll-opt-row')];
    rows.forEach((row, i) => {
      row.querySelector('input').placeholder = 'Option ' + (i + 1);
      row.querySelector('button').hidden = rows.length <= 2; // a poll always keeps at least 2 options
    });
    document.getElementById('add-poll-option').hidden = rows.length >= MAX_POLL_OPTIONS;
  }
  function resetPoll(){
    document.getElementById('poll-enabled').checked = false;
    document.getElementById('poll-fields').hidden = true;
    document.getElementById('poll-question').value = '';
    document.getElementById('poll-options').innerHTML = '';
    addPollOption(); addPollOption();
  }
  document.getElementById('poll-enabled').addEventListener('change', (e) => {
    document.getElementById('poll-fields').hidden = !e.target.checked;
  });
  document.getElementById('add-poll-option').addEventListener('click', () => addPollOption());
  resetPoll();

  async function submitReview(){
    const title = document.getElementById('title').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const category = document.getElementById('category').value;
    const isReview = !NON_REVIEW.includes(category);
    const rating = isReview ? parseFloat(document.getElementById('rating').value) : null;
    const body = document.getElementById('body').value.trim();
    const imageFile = document.getElementById('image').files[0];
    const status = document.getElementById('status');

    if(!title || !body){
      status.textContent = "Title and text are required.";
      return;
    }

    const pollOn = !isReview && document.getElementById('poll-enabled').checked;
    const pollQuestion = document.getElementById('poll-question').value.trim();
    const pollOptions = [...document.querySelectorAll('#poll-options .poll-option')].map(i => i.value.trim()).filter(Boolean);
    if(pollOn){
      if(!pollQuestion){ status.textContent = "Add a question for your poll."; return; }
      if(pollOptions.length < 2){ status.textContent = "Your poll needs at least 2 options."; return; }
      if(new Set(pollOptions.map(o => o.toLowerCase())).size !== pollOptions.length){
        status.textContent = "Each poll option needs to be different."; return;
      }
    }

    let image_url = null;
    if(imageFile){
      status.textContent = "Uploading image…";
      const path = Date.now() + '-' + imageFile.name.replace(/[^a-zA-Z0-9.]/g, '_');
      const { error: uploadError } = await sb.storage.from('review-images').upload(path, imageFile);
      if(uploadError){
        status.textContent = "Image upload failed: " + uploadError.message;
        return;
      }
      image_url = sb.storage.from('review-images').getPublicUrl(path).data.publicUrl;
    }

    const { data: saved, error } = await sb.from('reviews').insert({ title, subject, category, rating, body, image_url }).select().single();
    if(!error && pollOn){
      const { data: poll, error: pollError } = await sb.from('polls').insert({ review_id: saved.id, question: pollQuestion }).select().single();
      const { error: optError } = pollError ? { error: pollError } :
        await sb.from('poll_options').insert(pollOptions.map((label, position) => ({ poll_id: poll.id, label, position })));
      if(pollError || optError){
        status.textContent = "Published, but the poll couldn't be saved: " + (pollError || optError).message;
        loadManageList();
        return;
      }
    }
    if(error){
      status.textContent = "Error: " + error.message;
    } else {
      status.textContent = "Published! Check the live site.";
      resetPoll();
      document.getElementById('title').value = '';
      document.getElementById('subject').value = '';
      document.getElementById('body').value = '';
      document.getElementById('image').value = '';
      loadManageList();
    }
  }

  checkSession();
</script>

</body>
</html>
