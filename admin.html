<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Just Some Reviews</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  body{font-family:sans-serif;max-width:480px;margin:60px auto;padding:0 20px;color:#1C1B19;}
  h1{font-size:1.4rem;}
  input, select, textarea{width:100%;padding:8px;margin-bottom:12px;font-size:0.95rem;box-sizing:border-box;}
  textarea{min-height:100px;}
  button{padding:8px 16px;cursor:pointer;}
  #status{margin-top:10px;font-size:0.9rem;}
  #app{display:none;}
  .manage-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:0.9rem;}
  .manage-row button{background:#b3452f;color:#fff;border:none;border-radius:4px;padding:4px 10px;font-size:0.8rem;}
</style>
</head>
<body>

<div id="login">
  <h1>Log in</h1>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Log in</button>
  <div id="login-status"></div>
</div>

<div id="app">
  <h1>Add a review</h1>
  <input id="title" placeholder="Title (e.g. Past Lives)">
  <input id="subject" placeholder="Subject line (e.g. Directed by Celine Song, 2023)">
  <select id="category">
    <option value="film">Film</option>
    <option value="game">Game</option>
    <option value="music">Music</option>
  </select>
  <select id="rating">
    <option value="5">5 stars</option>
    <option value="4.5">4.5 stars</option>
    <option value="4">4 stars</option>
    <option value="3.5">3.5 stars</option>
    <option value="3">3 stars</option>
    <option value="2.5">2.5 stars</option>
    <option value="2">2 stars</option>
    <option value="1.5">1.5 stars</option>
    <option value="1">1 star</option>
  </select>
  <textarea id="body" placeholder="Your review"></textarea>
  <button onclick="submitReview()">Publish review</button>
  <div id="status"></div>

  <h1 style="margin-top:40px;">Manage reviews</h1>
  <div id="manage-list">Loading…</div>
</div>

<script>
  const SUPABASE_URL = "https://lzktxoizovfjgkxkpbhw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6a3R4b2l6b3ZmamdreGtwYmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDA3MDYsImV4cCI6MjEwNTg3NjcwNn0.NUWMnrx3XGoaDjQQovP5R100CDQL4Bk4Bix7kr52fJY";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if(data.session){
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadManageList();
    }
  }

  async function loadManageList(){
    const list = document.getElementById('manage-list');
    const { data, error } = await sb.from('reviews').select('*').order('created_at', {ascending:false});
    if(error){ list.textContent = 'Error loading reviews.'; return; }
    if(!data.length){ list.textContent = 'No reviews yet.'; return; }
    list.innerHTML = data.map(r => `
      <div class="manage-row">
        <span>${r.title} <em>(${r.category})</em></span>
        <button data-id="${r.id}">Delete</button>
      </div>
    `).join('');
    list.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Delete "' + btn.parentElement.querySelector('span').textContent.trim() + '"? This also removes its comments and likes.')) return;
        await sb.from('reviews').delete().eq('id', btn.dataset.id);
        loadManageList();
      });
    });
  }

  async function login(){
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      document.getElementById('login-status').textContent = error.message;
    } else {
      checkSession();
    }
  }

  async function submitReview(){
    const title = document.getElementById('title').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const category = document.getElementById('category').value;
    const rating = parseFloat(document.getElementById('rating').value);
    const body = document.getElementById('body').value.trim();
    const status = document.getElementById('status');

    if(!title || !body){
      status.textContent = "Title and review text are required.";
      return;
    }
    const { error } = await sb.from('reviews').insert({ title, subject, category, rating, body });
    if(error){
      status.textContent = "Error: " + error.message;
    } else {
      status.textContent = "Published! Check the live site.";
      document.getElementById('title').value = '';
      document.getElementById('subject').value = '';
      document.getElementById('body').value = '';
      loadManageList();
    }
  }

  checkSession();
</script>

</body>
</html>
